<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Mayhem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page-bg:#150e33;
  --btn-bg:rgba(255,255,255,.16);
  --btn-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#0b0720; }
}
:root[data-theme="dark"]{ --page-bg:#0b0720; }
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--page-bg);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:'Luckiest Guy','Arial Black',Impact,sans-serif;
}
#wrap{position:relative}
canvas{touch-action:none;display:block;width:100%;height:100%;border-radius:14px;box-shadow:0 0 40px rgba(255,138,31,.25)}
#touch{
  position:absolute;left:0;right:0;bottom:10px;display:none;
  justify-content:space-between;padding:0 12px;pointer-events:none;
}
#touch .grp{display:flex;gap:10px}
#touch button{
  pointer-events:auto;width:56px;height:56px;border-radius:50%;
  border:3px solid rgba(255,255,255,.55);background:var(--btn-bg);color:var(--btn-ink);
  font-family:inherit;font-size:15px;line-height:1;-webkit-tap-highlight-color:transparent;
}
#touch button.big{width:64px;height:64px;font-size:15px}
#touch button[data-k="fire"]{background:rgba(255,138,31,.45)}
#touch button[data-k="jump"]{background:rgba(110,224,79,.4)}
#touch button:active{transform:scale(.92)}
@media (pointer:coarse){ #touch{display:flex} }
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18);box-shadow:0 0 18px #ffe14a}}
#touch.reveal button{animation:pulse .6s ease-in-out 5}
#touch.off{visibility:hidden}
/* Restart the whole experience (back to Tutorial Step 1) */
#restartAll{
  position:absolute;top:8px;right:8px;z-index:2;
  padding:5px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.45);
  background:rgba(12,6,40,.6);color:#fff;font-family:inherit;font-size:12px;letter-spacing:.03em;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#restartAll:hover{border-color:#ffe14a;color:#ffe14a}
#restartAll:focus-visible{outline:2px solid #ffe14a;outline-offset:2px}

/* ===== REFINEMENT CONTROLS: design/debug tool layer, not part of the game ===== */
#refine{position:fixed;left:12px;top:12px;z-index:50;max-height:calc(100vh - 24px);display:flex;flex-direction:column;
  font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e6e6e6;letter-spacing:0;user-select:text;-webkit-user-select:text;touch-action:auto}
#refTab{align-self:flex-start;padding:7px 11px;border-radius:6px;border:1px dashed #8a8a8a;background:#202020;color:#e6e6e6;
  font:inherit;font-weight:700;letter-spacing:.06em;cursor:pointer}
#refTab:hover{border-color:#5ab0ff;color:#fff}
#refTab:focus-visible,#refine button:focus-visible,#refine input:focus-visible{outline:2px solid #5ab0ff;outline-offset:2px}
#refBody{margin-top:6px;width:300px;max-width:calc(100vw - 24px);overflow:auto;background:#1b1b1b;border:1px solid #4a4a4a;border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.5);padding:10px 12px 12px}
#refBody[hidden]{display:none}
#refBody .note{margin:0 0 8px;color:#9a9a9a;font-size:11px}
#refBody .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
#refBody button{font:inherit;color:#e6e6e6;background:#2a2a2a;border:1px solid #555;border-radius:5px;padding:6px 4px;cursor:pointer}
#refBody button:hover{border-color:#5ab0ff}
#refBody .presets button.on{background:#123a5c;border-color:#5ab0ff;color:#fff}
#refBody details{border-top:1px solid #333;padding:6px 0 2px}
#refBody summary{cursor:pointer;font-weight:700;color:#fff;padding:2px 0}
#refBody summary span{color:#5ab0ff;font-weight:400}
#refBody .ctl{margin:7px 0 0}
#refBody .row{display:flex;justify-content:space-between;gap:8px}
#refBody output{color:#5ab0ff;font-variant-numeric:tabular-nums;white-space:nowrap}
#refBody input[type=range]{width:100%;margin:3px 0 0;accent-color:#5ab0ff}
#refBody .ends{display:flex;justify-content:space-between;color:#7a7a7a;font-size:10px}
#refBody .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;border-top:1px solid #333;padding-top:10px}
#refBody .pvgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#refBody .pvgrid button.on{background:#123a5c;border-color:#5ab0ff;color:#fff}
#refBody .chk{display:flex;align-items:center;gap:6px;margin:8px 0 6px;cursor:pointer}
#refBody .chk span{color:#7a7a7a}
#refBody .chk input{accent-color:#5ab0ff}
#pvExit{width:100%}
#pvExit:disabled{opacity:.45;cursor:default}
#refBody .status{min-height:1.3em;margin:6px 0 0;color:#9a9a9a;font-size:11px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="restartAll" type="button" title="Restart the whole experience from Tutorial Step 1">↺ Restart</button>
  <div id="touch">
    <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="grp"><button class="big" data-k="jump">JUMP</button><button class="big" data-k="fire">ZAP!</button></div>
  </div>
</div>

<div id="refine" aria-label="Refinement controls (design tool)">
  <button id="refTab" type="button" aria-expanded="false" aria-controls="refBody" title="Show / hide (` key)">⚙ REFINEMENT CONTROLS ▸</button>
  <div id="refBody" hidden>
    <p class="note">Design tool. Changes apply live. Tutorial order, completion rules and controls are unchanged.</p>
    <div class="presets">
      <button type="button" data-preset="subtle">V1 Subtle</button>
      <button type="button" data-preset="balanced">V2 Balanced</button>
      <button type="button" data-preset="exaggerated">V3 Exaggerated</button>
    </div>
    <div id="refGroups"></div>
    <details open class="pv">
      <summary>Preview Behavior <span>— for screenshots</span></summary>
      <p class="note">Pauses the game and shows a demo using the values above. Nothing in the tutorial changes.</p>
      <div class="pvgrid">
        <button type="button" data-pv="wake">Preview Spongy Wake</button>
        <button type="button" data-pv="move">Preview Snappy Movement</button>
        <button type="button" data-pv="fly">Preview Light Flying</button>
        <button type="button" data-pv="charge">Preview Springy Charge</button>
      </div>
      <label class="chk"><input type="checkbox" id="refHold"> Hold at 80% Charge <span>(Springy Charge)</span></label>
      <button type="button" id="pvExit" disabled>Exit preview · resume game</button>
    </details>
    <div class="actions">
      <button type="button" id="refReset">Reset to Final Settings</button>
      <button type="button" id="refCopy">Copy values</button>
    </div>
    <p class="status" id="refStatus" aria-live="polite"></p>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 480, H = 720, SEC_H = 1400, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
const FONT = "'Luckiest Guy','Arial Black',Impact,sans-serif";

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
/* ---------- refinement settings (live-tuned by the REFINEMENT CONTROLS panel) ----------
   FINAL holds the shipped values; every behaviour reads from R, so FINAL reproduces the prototype exactly. */
const FINAL = Object.freeze({
  wakeSquash: 27,     // Wake: how far the body squashes on contact, % of its height (width bulges in proportion)
  wakeOvershoot: 22.9,// Wake: peak overshoot of the rebound after release, % (22.9% = the original damping 7.6)
  moveResponse: 16,   // Movement: acceleration rate on the ground, per second (half that in the air)
  moveLean: 100,      // Movement: running lean (and stretch above 100%), % of final
  flyEase: 100,       // Flying: mouse-follow softness, % (higher = floatier, softer follow)
  flyBob: 100,        // Flying: floating bob and sway, % of final
  chargeTime: 1.0,    // Charge: seconds to full charge in the tutorial (main-game boost scales with it: 0.9 s at 1.0)
  chargeGrow: 45,     // Charge: extra size at full charge in the tutorial, % (main game scales with it: +50% at 45)
  boost: 100          // Charge: burst / boost strength, % of final
});
const R = Object.assign({}, FINAL);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex2rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix = (a, b, t) => { const A=hex2rgb(a),B=hex2rgb(b); return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`; };
const el = (c,x,y,rx,ry) => { c.beginPath(); c.ellipse(x,y,rx,ry,0,0,TAU); };
const circ = (c,x,y,r) => { c.beginPath(); c.arc(x,y,r,0,TAU); };
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function star(c,x,y,r,rot){ c.beginPath(); for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5-Math.PI/2, rad=i%2?r*.45:r; c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);} c.closePath(); }

/* ---------- audio (tiny synth beeps) ---------- */
let AC = null, muted = false;
function tone(f1, f2, dur, type='square', vol=.05, delay=0){
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) {}
}
function sfx(k){
  switch(k){
    case 'jump': tone(300,620,.13,'square',.04); break;
    case 'fire': tone(260,70,.22,'sawtooth',.06); break;
    case 'water': tone(420,220,.12,'sine',.09); tone(300,560,.12,'sine',.07,.1); break;
    case 'ice': tone(1400,2200,.1,'triangle',.06); tone(2200,900,.12,'triangle',.05,.06); break;
    case 'hit': tone(700,120,.18,'square',.06); tone(500,900,.12,'square',.04,.08); break;
    case 'pop': tone(500,100,.14,'square',.06); break;
    case 'bonk': tone(220,60,.25,'square',.09); break;
    case 'hurt': tone(330,70,.35,'sawtooth',.07); break;
    case 'bounce': tone(260,900,.18,'sine',.08); break;
    case 'giant': tone(90,40,.7,'sawtooth',.13); tone(140,500,.35,'square',.05,.05); break;
    case 'stomp': tone(120,35,.3,'square',.12); break;
    case 'step': tone(70,40,.09,'square',.06); break;
    case 'poof': tone(500,100,.3,'sine',.07); break;
    case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,f*1.02,.18,'square',.05,i*.12)); break;
    case 'start': tone(400,800,.15,'square',.05); break;
    case 'charge': tone(180+(P?P.charge:0)*800,260+(P?P.charge:0)*900,.09,'square',.035); break;
    case 'boost': tone(180,950,.3,'sawtooth',.1); tone(950,200,.3,'triangle',.05,.05); break;
    case 'boostend': tone(520,260,.12,'triangle',.05); break;
    case 'fizzle': tone(300,90,.2,'sine',.06); break;
    case 'fly': [400,560,760,1040].forEach((f,i)=>tone(f,f*1.08,.12,'triangle',.07,i*.07)); break;
    case 'gulp': tone(320,110,.12,'sine',.1); tone(140,420,.22,'sine',.09,.1); break;
    case 'roar': tone(110,40,.7,'sawtooth',.15); tone(230,60,.5,'square',.06,.03); break;
    case 'deflate': tone(700,90,.5,'sine',.09); tone(500,80,.4,'triangle',.05,.1); break;
  }
}

/* ---------- sizing ---------- */
let scaleF = 1;
function resize(){
  const aw = document.body.clientWidth, ah = document.body.clientHeight;
  const w = Math.max(200, Math.min(aw, ah * 2 / 3)), h = w * 1.5;
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scaleF = cv.width / W;
}
window.addEventListener('resize', resize); resize();

/* ---------- level data ---------- */
const SECTIONS = [
  { name:'Spooky Garden',  sub:'Ghosts, tiny ghosts and slimes!',           bg:['#1a1650','#3b1d70'], types:[['stone',1]], wMin:120,wMax:170,gapMin:70,gapMax:92, ground:['slime','pumpkin'], air:['ghost','tinyghost'], pe:.22, spawn:3.6, maxAir:2 },
  { name:'Pumpkin Patch',  sub:'Hoppy and rolling pumpkins, shy Boos!',    bg:['#2a1252','#6b2a7e'], types:[['stone',60],['move',40]], wMin:100,wMax:140,gapMin:74,gapMax:96, ground:['pumpkin','roller','slime'], air:['ghost','bat','tinyghost','booghost'], pe:.30, spawn:3.0, maxAir:3 },
  { name:'Bat Belfry',     sub:'Dive-bombing bats, goo from below!',        bg:['#0f0f40','#2d1a70'], types:[['stone',55],['crumble',45]], wMin:90,wMax:125,gapMin:76,gapMax:98, ground:['slime','pumpkin','roller'], air:['bat','diver','booghost','lobber'], pe:.28, spawn:2.6, maxAir:4 },
  { name:'Eyeball Heights',sub:'Staring eyes! Use the bounce pads!',    bg:['#1b0f40','#4f1a72'], types:[['stone',30],['move',25],['crumble',25],['bounce',20]], wMin:80,wMax:110,gapMin:78,gapMax:100, ground:['pumpkin','slime','roller'], air:['eyeball','minieye','diver','bat','lobber','tinyghost'], pe:.30, spawn:2.4, maxAir:4 }
];
const ENEMY = {
  ghost:{r:16,pts:100,hp:1}, pumpkin:{r:18,pts:150,hp:1,fh:16}, bat:{r:15,pts:150,hp:1},
  slime:{r:15,pts:100,hp:1,fh:13}, eyeball:{r:20,pts:250,hp:2},
  tinyghost:{r:11,pts:75,hp:1}, booghost:{r:16,pts:150,hp:1}, roller:{r:17,pts:150,hp:1,fh:17},
  diver:{r:15,pts:200,hp:1}, lobber:{r:14,pts:100,hp:1}, minieye:{r:12,pts:150,hp:1},
  dummy:{r:20,pts:0,hp:1}       // tutorial practice target (harmless, worth no points)
};
const GIANT_T = 8, FLY_T = 7, FLY_SPEED = 95;

let platforms, pickups, flyPicks, enemies, secStart, GOAL;
function buildLevel(){
  const R = mulberry32(1031), r = (a,b)=>a+R()*(b-a);
  platforms = []; pickups = []; enemies = []; secStart = [];
  const ground = {type:'ground',x:-40,y:0,w:W+80,h:200,bx:-40,dx:0,sec:0};
  platforms.push(ground); secStart[0] = ground;
  let y = 0, cx = W/2, lastType = 'stone';
  for (let s = 0; s < 4; s++){
    const S = SECTIONS[s]; let firstInSec = true;
    while (y > -SEC_H*(s+1)){
      y -= r(S.gapMin, S.gapMax);
      let type = 'stone';
      if (!(s>0 && firstInSec) && lastType !== 'crumble' && lastType !== 'bounce'){
        const tot = S.types.reduce((a,t)=>a+t[1],0); let k = R()*tot;
        for (const t of S.types){ k -= t[1]; if (k <= 0){ type = t[0]; break; } }
      }
      const w = type==='bounce' ? 72 : r(S.wMin, S.wMax);
      cx = clamp(cx + r(-165,165), w/2+14, W-w/2-14);
      const p = {type,x:cx-w/2,y:Math.round(y),w,h:16,bx:cx-w/2,dx:0,sec:s,sp:r(.7,1.2),ph:r(0,TAU),amp:0,state:'idle',t:0,fy:0,squish:0};
      if (type==='move'){ p.amp = r(50,85); p.bx = clamp(p.bx, p.amp+10, W-w-p.amp-10); p.x = p.bx; cx = p.bx + w/2; }
      if (s>0 && firstInSec){ secStart[s] = p; p.first = true; }
      platforms.push(p);
      if (type==='stone' && !p.first && w>=100 && y < -260 && R() < S.pe){
        const kind = S.ground[Math.floor(R()*S.ground.length)];
        enemies.push(newEnemy(kind, p.x+w/2, p.y-20, {plat:p, ox:w/2+r(-20,20), dir:R()<.5?-1:1, ph:r(0,TAU), cd:r(.5,2), yo:0, vyo:0}));
      }
      firstInSec = false; lastType = type;
    }
  }
  const gy = Math.round(y - 96);
  const gp = {type:'stone',x:W/2-160,y:gy,w:320,h:16,bx:W/2-160,dx:0,sec:3,sp:1,ph:0,amp:0,state:'idle',t:0,fy:0,squish:0,goal:true};
  platforms.push(gp);
  GOAL = {x:W/2, y:gy-250, r:135, platY:gy};
  [-650,-2150,-3550,-4950].forEach(ty=>{
    let best=null, bd=1e9;
    platforms.forEach(p=>{ if(p.type==='stone'&&!p.first&&!p.goal&&p.type!=='ground'){ const d=Math.abs(p.y-ty); if(d<bd){bd=d;best=p;} } });
    if (best){ pickups.push({x:best.x+best.w/2,y:best.y-36,taken:false}); enemies = enemies.filter(e=>e.plat!==best); }
  });
  flyPicks = [];
  [-480,-2900,-4300].forEach(ty=>{
    let best=null, bd=1e9;
    platforms.forEach(p=>{ if(p.type==='stone'&&!p.first&&!p.goal){ const d=Math.abs(p.y-ty); if(d<bd){bd=d;best=p;} } });
    if (best){ flyPicks.push({bx:best.x+best.w/2,by:best.y-85,x:best.x+best.w/2,y:best.y-85,taken:false,ph:Math.random()*6}); enemies = enemies.filter(e=>e.plat!==best); }
  });
}
function newEnemy(kind,x,y,extra){
  const d = ENEMY[kind];
  return Object.assign({kind,x,y,r:d.r,pts:d.pts,hp:d.hp,fh:d.fh||0,state:'alive',t:Math.random()*3,t2:0,flash:0,sx:1,sy:1,rot:0,sc:1,tint:null,
    lx:0,ly:0,mode:'hover',timer:rand(1.8,2.6),blink:0,jx:0,lastBurst:-1,burn:0,wet:0,wetT:0,frozen:0,fz:0,stun:0,kvx:0,kvy:0}, extra||{});
}

/* ---------- state ---------- */
let state = 'title', time = 0, titleT = 0;
let punch = 0, rayT = 0, P, camY, score, kills, scorePop, shakeMag, flash, hitstop, spawnT, maxSec, bigMsg, banner, overT, winT;
let projs, particles, texts, burstId, hint, goalMsgShown, pickupT, seen, toasts, toast;
const TIPS = {
 ghost:['Ghost','Floats side to side, drifting your way'],
 tinyghost:['Tiny Ghosts','Fast zig-zag trios!'],
 booghost:['Shy Boo','Freezes when you look at it. Turn away and it sneaks up!'],
 pumpkin:['Pumpkin','Hops back and forth on its platform'],
 roller:['Rolling Pumpkin','Rolls fast and never hops'],
 bat:['Bat','Swoops in from the sides'],
 diver:['Dive Bat','Hovers up high, shakes, then dive-bombs!'],
 slime:['Slime','Crawls, then leaps when you get close'],
 lobber:['Goo Bubble','Lobbed up from below in a big arc'],
 eyeball:['Eyeball','Stares, shakes, then charges. Takes 2 hits'],
 minieye:['Mini Eyes','Loop in figure-8s around you']
};
const keys = {left:false,right:false,jump:false};
const touchIds = new Set();
let touchN = 0; const wheelTimes = [];
// two-finger trackpad: browsers can't see resting fingers, but two-finger scroll/pinch fires wheel events
const trackpadActive = () => { const n = performance.now(); while (wheelTimes.length && n-wheelTimes[0]>200) wheelTimes.shift(); return wheelTimes.length>=3; };
// boost: ONLY two fingers (touchscreen: 2 touches held; trackpad: 2 fingers kept moving gently)
let mouseDown = false;   // trackpad/mouse: click and HOLD (a two-finger click-and-hold counts too)
const chargeHeld = () => mouseDown || touchIds.size>=2 || touchN>=2;
const LOW_CAM = -(H-110);
let ctrlB = 0, revealT = 0, modeFlash = 0, modeCol = '#6ee04f', mouseX = null, mouseY = null, titleHover = false, titleNope = 0, startT = 0;
const isTouch = () => !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);

function resetPlayer(){
  P = {x:W/2,y:0,vx:0,vy:0,face:1,sc:1,scv:0,target:1,onGround:true,ground:platforms[0],coyote:0,buffer:0,inv:0,hp:3,giant:0,
       atk:0,atkCd:0,moodT:0,mood:'normal',sq:0,walkT:0,blinkT:2,blink:0,rot:0,bouncing:false,stepT:0,happyT:0,gulpT:0,stompPending:false,gT:0,giantAge:0,warn3:false,fly:0,flyAge:0,flyWarn:false,flyTrail:0,glide:false,runT:0,wingA:0,charge:0,charging:false,chargeLock:false,chargeFx:0,boostT:0,boostCd:0,boostGrace:0,boostEndT:0,cdMsg:false,trail:[],boostUses:0};
}
function resetGame(){
  buildLevel(); resetPlayer();
  camY = LOW_CAM; score = 0; kills = 0; scorePop = 0; shakeMag = 0; flash = 0; hitstop = 0; spawnT = 3.2; maxSec = 0;

function press(k){

  if (state==='tutorial'){ tutPress(k); return; }
  if (state!=='play'){ actionStart(); return; }
  if (k==='jump'){ keys.jump = true; P.buffer = .13; }

}
function release(k){ if (k in keys) keys[k] = false; }

window.addEventListener('keydown', e => {
  if (e.code==='Backquote'){ e.preventDefault(); toggleRefine(); return; }
  if (inRefine(e)) return;                      // typing in the refinement panel never moves the monster
  if (e.code==='KeyM'){ muted = !muted; return; }
  if (e.code==='ArrowDown'){ e.preventDefault(); return; }   // Down does nothing
  const k = KMAP[e.code]; if (!k) return;
  e.preventDefault(); if (e.repeat) return; press(k);
});

  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); press(k); });

});

['gesturestart','gesturechange'].forEach(t => window.addEventListener(t, e => e.preventDefault()));

// FIRE burns (kills; tough enemies catch fire), WATER pushes (washes enemies away after 2 splashes),
// ICE freezes (harmless for 3s; any hit on a frozen enemy shatters it for bonus points)
function hurtEnemy(e, kind, ix, iy, p){
  if (e.state!=='alive') return;
  if (e.dummy) e.wasHit = true;
  const ang = p ? Math.atan2(p.vy,p.vx) : 0, dx = Math.cos(ang), dy = Math.sin(ang);
  if (kind==='fire'){
    addP({type:'ring',x:ix,y:iy,size:42,life:.3,color:'#ffb02e'});

    for(let i=0;i<5;i++) addP({type:'spark',x:ix,y:iy,vx:rand(-200,200),vy:rand(-220,-40),g:400,size:rand(2,3.5),life:.5,color:'#ffe14a'});
  } else if (kind==='water'){
    addP({type:'ring',x:ix,y:iy,size:64,life:.45,color:'#8fd8ff'});
    for(let i=0;i<12;i++){ const a=ang+rand(-.55,.55), sp=rand(160,380); addP({type:'drop',x:ix,y:iy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,g:500,size:rand(3,6),life:.6,color:'#59b9ff'}); }
    for(let i=0;i<6;i++) addP({type:'line',x:ix+rand(-8,8),y:iy+rand(-8,8),vx:dx*520,vy:dy*520,size:rand(10,20),life:.3,color:'#d6f1ff'});
  } else {
    addP({type:'ring',x:ix,y:iy,size:72,life:.45,color:'#e6fbff'});
    for(let i=0;i<10;i++){ const a=rand(0,TAU); addP({type:'flake',x:ix,y:iy,vx:Math.cos(a)*rand(60,180),vy:Math.sin(a)*rand(60,180),size:rand(4,8),life:.7,color:'#fff',vr:rand(-6,6),drag:2}); }
    for(let i=0;i<6;i++){ const a=rand(0,TAU); addP({type:'shard',x:ix,y:iy,vx:Math.cos(a)*rand(80,200),vy:Math.sin(a)*rand(80,200),g:300,size:rand(4,7),life:.6,color:'#d8f7ff',vr:rand(-12,12)}); }
  }
  // any hit on a frozen enemy shatters it (combo bonus)
  if (e.frozen>0){ killEnemy(e, kind==='fire'?'fire':'ice', 50, kind==='fire'?'MELTED!':'SHATTERED!'); return; }
  if (kind==='fire'){
    e.hp--;
    if (e.hp<=0){ killEnemy(e,'fire',0); return; }
    e.burn = 1.1; e.flash = .25;
    addText('IT BURNS!', e.x, e.y-28, {size:20,color:'#ff9f1c'}); sfx('hit'); hitstop=.04; shake(3);
    return;
  }
  if (kind==='water'){
    const wasBurning = e.burn>0; e.burn = 0;
    e.kvx = dx*880; e.kvy = dy*560; e.stun = .8; e.wet++; e.wetT = 3; e.flash = 0;
    if (wasBurning){ for(let i=0;i<7;i++) addP({type:'puff',x:e.x,y:e.y-8,vx:rand(-40,40),vy:rand(-120,-40),size:rand(8,14),life:.7,color:'#e8e8f0',drag:1.5}); addText('PSSSH!', e.x, e.y-44, {size:18,color:'#e8e8f0'}); }
    const need = e.kind==='eyeball' ? 3 : 2;
    if (e.wet>=need){ killEnemy(e,'water',0,'WASHED AWAY!'); return; }
    addText('PUSH!', e.x, e.y-28, {size:22,color:'#6ec6ff'}); sfx('pop'); hitstop=.04; shake(3);
    return;
  }
  // ice
  e.frozen = 3.2; e.fz = 0; e.burn = 0; e.stun = 0; e.kvx = e.kvy = 0; e.mode='hover'; e.timer=3.5; e.jx = 0; e.wet = 0; e.wetT = 0; e.rot = 0;
  e.tint = '#bfeeff';
  addText('FROZEN!', e.x, e.y-30, {size:22,color:'#c8f3ff'}); sfx('ice'); hitstop=.05; shake(3);
}

/* ---------- player attack ---------- */
const WORDS = {fire:'FWOOSH!',water:'SPLOOSH!',ice:'BRR-ZAP!'};
function nearestEnemy(cx,cy,maxD){
  let best=null, bd=maxD;
  for (const e of enemies){
    if (e.state!=='alive') continue;
    if (e.y<camY-10 || e.y>camY+H+10 || e.x<-20 || e.x>W+20) continue;
    const d = Math.hypot(e.x-cx,e.y-cy); if (d<bd){ bd=d; best=e; }
  }
  return best;
}
function attack(){
  if (P.atkCd>0) return;
  hint.atk = true; P.atkCount = (P.atkCount||0)+1;
  const kind = Math.random()<.5 ? 'fire' : 'ice';
  P.atkCd = kind==='water' ? .4 : .3; P.atk = .22;
  const cx = P.x, cy = P.y - 24*P.sc;
  const tgt = nearestEnemy(cx,cy,430);
  let ang;
  if (tgt){ ang = Math.atan2(tgt.y-cy, tgt.x-cx); if (Math.abs(tgt.x-cx)>8) P.face = tgt.x>cx?1:-1; }
  else ang = P.face>0 ? 0 : Math.PI;
  const g = P.giant>0 ? 1.7 : 1;
  const mx = cx + Math.cos(ang)*20*P.sc, my = cy + Math.sin(ang)*20*P.sc;
  if (kind==='fire'){
    // short, wide cone of wobbly flames
    burstId++;
    for (let i=0;i<11;i++){
      const a = ang + rand(-.42,.42), sp = rand(420,640);
      projs.push({kind,x:mx,y:my,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.2,.32)*(g>1?1.3:1),age:0,r:rand(8,12)*g,rr:8*g,burst:burstId});
    }
    addP({type:'ring',x:mx,y:my,size:46*g,life:.25,color:'#ffb02e'});
    sfx('fire');
  } else if (kind==='water'){
    // one big, heavy splashy ball that shoves enemies back
    projs.push({kind,x:mx,y:my,vx:Math.cos(ang)*400,vy:Math.sin(ang)*400-50,life:1.5,age:0,r:14*g,rr:14*g,rot:0});
    P.vx -= Math.cos(ang)*140;                                  // recoil
    for (let i=0;i<6;i++) addP({type:'bubble',x:mx,y:my,vx:Math.cos(ang)*rand(40,140)+rand(-30,30),vy:Math.sin(ang)*rand(40,140)+rand(-40,0),size:rand(3,7),life:.6,color:'#bfe9ff',drag:2});
    sfx('water');
  } else {
    // fast, thin ice crystal that leaves a frosty trail
    projs.push({kind,x:mx,y:my,vx:Math.cos(ang)*650,vy:Math.sin(ang)*650,life:1.1,age:0,r:10*g,rr:10*g,rot:0});
    addP({type:'ring',x:mx,y:my,size:44*g,life:.3,color:'#c8f3ff'});
    for (let i=0;i<6;i++){ const a=rand(0,TAU); addP({type:'flake',x:mx,y:my,vx:Math.cos(a)*rand(40,120),vy:Math.sin(a)*rand(40,120),size:rand(4,7),life:.5,color:'#fff',vr:rand(-6,6),drag:2}); }
    sfx('ice');
  }
  addText(WORDS[kind], P.x, P.y-62*P.sc, {size:18*Math.min(1.5,P.sc),color:REACT[kind].col,life:.6,vy:-40});
}

  for (const p of platforms) if (p.type!=='ground' && Math.abs(p.y-P.y)<450) p.jig = .7;   // platforms wobble
  for (const e of enemies){
    if (e.state!=='alive') continue;
    if (e.y<camY-60 || e.y>camY+H+60) continue;
    if (Math.hypot(e.x-P.x, e.y-P.y) < 760) launchEnemy(e, e.x>=P.x?1:-1, FLING_WORDS[Math.floor(Math.random()*FLING_WORDS.length)]);
  }
}
function endGiant(){

  shake(7); punch = -.03; P.mood = 'surprised'; P.moodT = .9; P.sq = -.3;

  for (let i=0;i<8;i++){ const a=rand(0,TAU); addP({type:'star',x:P.x,y:P.y-60,vx:Math.cos(a)*rand(80,220),vy:Math.sin(a)*rand(80,220),g:300,size:rand(6,10),life:.8,color:'#ffe14a',vr:rand(-8,8)}); }
  addText('POOF! Tiny again!', P.x, P.y-90, {size:28,color:'#9bf08a',life:1.4,pop:true});
}
function stomp(){

/* ---------- player damage ---------- */
function hurtPlayer(e){
  if (P.inv>0 || P.giant>0 || P.fly>0 || P.boostT>0 || P.boostGrace>0) return;
  P.charging = false; P.charge = 0; P.chargeLock = true;
  P.hp--; P.inv = 1.6; P.mood='hurt'; P.moodT = .8;
  P.vy = -420; P.vx = (P.x<e.x?-1:1)*260; P.onGround = false; P.coyote = 0;
  shake(8); sfx('hurt'); hitstop = .06;
  addText('OUCH!', P.x, P.y-70, {size:30,color:'#ff6b6b'});
  for (let i=0;i<6;i++){ const a=rand(0,TAU); addP({type:'star',x:P.x,y:P.y-30,vx:Math.cos(a)*rand(80,200),vy:Math.sin(a)*rand(80,200),size:rand(6,10),life:.6,color:'#ffe14a',vr:rand(-9,9)}); }
  if (P.hp<=0){ state='over'; overT=0; P.vy=-520; P.rot=0; }
}

/* ---------- update ---------- */
function secIdx(y){ return clamp(Math.floor((-y+1)/SEC_H),0,3); }

function updatePlatforms(dt){
  for (const p of platforms){
    p.dx = 0;
    if (p.type==='move'){ const ox=p.x; p.x = p.bx + Math.sin(time*p.sp+p.ph)*p.amp; p.dx = p.x-ox; }
    if (p.squish>0) p.squish = Math.max(0,p.squish-dt*4);
    if (p.jig>0) p.jig = Math.max(0,p.jig-dt*1.2);
    if (p.type==='crumble'){
      if (p.state==='shaking'){ p.t+=dt; if (p.t>.5){ p.state='falling'; p.t=0; p.fy=0; p.fv=0; } }
      else if (p.state==='falling'){ p.fv+=1400*dt; p.fy+=p.fv*dt; p.t+=dt; if (p.t>.8){ p.state='gone'; p.t=0; } }
      else if (p.state==='gone'){ p.t+=dt; if (p.t>3){ p.state='idle'; p.fy=0; p.t=0; } }
    }
  }
}

function updatePlayer(dt){
  const g = P.giant>0, fl = P.fly>0, inp = state==='play' || (state==='tutorial' && tutMoveOK());
  const dir = (fl || !inp) ? 0 : (keys.right?1:0) - (keys.left?1:0);
  updateCharge(dt, inp && !fl && state==='play');
  const maxV = (g ? 265 : 228) * (P.charge>.02 ? .35 : 1);   // slow while charging
  if (fl){
    // FLYING: the mouse steers, keyboard left/right is ignored
    const tx = mouseX!=null ? clamp(mouseX,18,W-18) : P.x, d0 = tx-P.x;
    const fr = 5*100/R.flyEase;                     // follow rate: lower = softer, floatier
    P.vx = d0*fr; P.x += d0*Math.min(1,fr*dt);
    if (Math.abs(P.vx)>30) P.face = P.vx>0 ? 1 : -1;
  } else P.vx += (dir*maxV - P.vx) * Math.min(1, (P.onGround?R.moveResponse:R.moveResponse/2)*dt);
  if (dir){ P.face = dir; hint.move = true; }
  P.buffer -= dt; P.coyote -= dt; P.atkCd -= dt; P.atk -= dt; P.inv -= dt; P.moodT -= dt; P.happyT -= dt;
  if (fl) P.vy = -FLY_SPEED;
  else if (P.boostT>0){ const bf=P.boostT/BOOST_D; P.vy = -(250+(BOOST_V*R.boost/100-250)*bf); }   // boost: fast burst that eases off
  else if (P.charging && !P.onGround){ P.vy = P.vy*Math.exp(-5*dt) + 260*dt; if (P.vy>140) P.vy = 140; }   // hover while charging in the air                                  // float upward on its own
  else {
    P.vy = Math.min(P.vy + (P.glide?600:1700)*dt, P.glide?115:950);   // glide = gentle float down after flying
    if (P.vy<0 && !keys.jump && !P.bouncing && !P.glide && inp) P.vy += 2600*dt;
    if (P.vy>=0) P.bouncing = false;
  }

  if (!fl && inp && !P.charging && P.charge<.02 && P.buffer>0 && P.coyote>0){
    P.vy = g ? -700 : -660; P.buffer=0; P.coyote=0; P.onGround=false; P.sq=-.32; hint.jump=true; P.glide=false;
    dust(P.x,P.y,4,50); addP({type:'ring',x:P.x,y:P.y,size:40,life:.3,color:'#d9c7ff'}); sfx('jump');
  }

  if (!fl && P.onGround && P.ground) P.x += P.ground.dx;
  const prevY = P.y;
  if (fl){
    P.y += P.vy*dt; if (P.y < GOAL.platY+70) P.y = GOAL.platY+70;
    P.onGround = false; P.ground = null;
  } else {
    P.x += P.vx*dt; P.y += P.vy*dt;
    if (P.x < -12) P.x = W+12; else if (P.x > W+12) P.x = -12;
    P.onGround = false;
    if (P.vy >= 0){
      const fw = 12*P.sc;
      for (const p of platforms){
        if (p.state==='falling' || p.state==='gone') continue;
        if (prevY <= p.y+5 && P.y >= p.y && P.x+fw > p.x && P.x-fw < p.x+p.w){
          const impact = P.vy;
          P.y = p.y; P.onGround = true; P.ground = p; P.coyote = .1; P.vy = 0;
          if (P.glide){ P.glide = false; dust(P.x,P.y,5,50); }
          if (impact > 240){ P.sq = clamp(impact/1800,.08,.34); dust(P.x,P.y,4+Math.floor(P.sc*2),60*P.sc); }
          if (p.type==='bounce'){ P.vy = g ? -1100 : -980; P.bouncing = true; p.squish = 1; P.sq = -.4; P.onGround=false; P.coyote=0; sfx('bounce'); addP({type:'ring',x:P.x,y:p.y,size:60,life:.35,color:'#ffd23f'}); }
          if (p.type==='crumble' && p.state==='idle'){ p.state='shaking'; p.t=0; }
          if (P.stompPending) bigStomp(); else if (g && impact > 420) stomp();
          break;
        }
      }
    }
    if (P.y > 0){ P.y = 0; P.vy = 0; P.onGround = true; P.ground = platforms[0]; if (P.glide) P.glide=false; }
  }

  if (inp) P.target = (P.giant>0 ? 2.8 : 1) * (1 + .5*(R.chargeGrow/45)*P.charge);      // grows while charging, back to normal after
  P.sq += (0 - P.sq) * Math.min(1, 14*dt);
  P.scv = (P.scv + (P.target - P.sc)*260*dt) * Math.exp(-7*dt);
  P.sc += P.scv*dt;
  if (P.boostT>0){
    P.boostT -= dt;
    P.trail.push({x:P.x,y:P.y,face:P.face,sc:P.sc,life:.35});
    for (let i=0;i<3;i++) addP({type:'puff',x:P.x+rand(-10,10)*P.sc,y:P.y+rand(0,10),vx:rand(-30,30),vy:rand(60,200),size:rand(6,12)*Math.min(1.6,P.sc),life:rand(.3,.5),color:i%2?'#ffb02e':'#fff3b0',drag:2});
    addP({type:'line',x:P.x+rand(-16,16)*P.sc,y:P.y-rand(0,30),vx:0,vy:500,size:rand(14,26),life:.25,color:'#ffe9a8'});
    if (P.boostT<=0) endBoost();
  }
  for (const tr of P.trail) tr.life -= dt;
  while (P.trail.length && P.trail[0].life<=0) P.trail.shift();
  P.wingA += ((fl || P.glide ? 1 : 0) - P.wingA) * Math.min(1, 8*dt);
  if (fl){
    P.fly -= dt; P.flyAge += dt;
    if (P.fly<2 && !P.flyWarn){ P.flyWarn = true; addText('landing soon!', P.x, P.y-90, {size:22,color:'#7fe3ff',life:1.2,pop:true}); sfx('step'); }
    P.flyTrail -= dt;
    if (P.flyTrail<=0){ P.flyTrail=.05; addP({type:'spark',x:P.x+rand(-10,10),y:P.y+rand(-4,6),vy:60,size:rand(3,5),life:.5,color:Math.random()<.5?'#bfefff':'#fff'}); }
    if (P.fly<=0) endFly();
  }
  if (g){
    P.giant -= dt; P.giantAge += dt; P.gulpT -= dt;
    if (P.stompPending){ P.gT += dt; if (P.gT>1.1) bigStomp(); }
    if (P.giant<3 && !P.warn3){ P.warn3 = true; addText('shrinking soon!', P.x, P.y-250, {size:24,color:'#ff9f1c',life:1.3,pop:true}); sfx('step'); }
    if (Math.random()<dt*14) addP({type:'star',x:P.x+rand(-50,50),y:P.y-rand(20,130),vy:-40,size:rand(4,8),life:.6,color:Math.random()<.5?'#ffe14a':'#9bf08a',vr:rand(-6,6)});
    if (P.giant<=0) endGiant();
  }
  P.walkT += dt * (Math.abs(P.vx)/200);
  P.blinkT -= dt; if (P.blinkT<=0){ P.blink=.12; P.blinkT=rand(2,4); } P.blink -= dt;
  // running feedback: little dust puffs at the feet
  if (!fl && P.onGround && inp && Math.abs(P.vx)>120){ P.runT -= dt; if (P.runT<=0){ P.runT=.09; dust(P.x-P.face*10*P.sc,P.y,1,30); } }
  if (g && P.onGround && Math.abs(P.vx)>60){ P.stepT -= dt; if (P.stepT<=0){ P.stepT=.3; shake(3.5); dust(P.x,P.y,3,60); sfx('step'); } }
}

// ---- Charge boost: hold -> charge (grow + shake) -> auto upward burst -> back to normal ----
const CHARGE_T = .9, BOOST_V = 980, BOOST_D = .38, BOOST_CD = 1.8;
function updateCharge(dt, active){
  P.boostCd = Math.max(0,P.boostCd-dt); P.boostEndT = Math.max(0,P.boostEndT-dt); P.boostGrace = Math.max(0,P.boostGrace-dt);
  const holding = active && chargeHeld();
  if (!holding){ P.chargeLock = false; P.cdMsg = false; }          // must let go between boosts
  const can = holding && !P.chargeLock && P.boostCd<=0 && P.boostT<=0;
  if (holding && P.boostCd>0 && P.boostT<=0 && !P.cdMsg){ P.cdMsg = true; addText('Recharging...',P.x,P.y-80*P.sc,{size:18,color:'#c8f3ff',life:.8}); }
  if (can){
    if (!P.charging){ P.charging = true; hint.boost = true; addText('Charging!',P.x,P.y-90*P.sc,{size:22,color:'#ffe14a',life:.9,pop:true}); }
    P.charge = Math.min(1,P.charge+dt/(CHARGE_T*R.chargeTime));
    P.buffer = 0;
    P.chargeFx -= dt;
    if (P.chargeFx<=0){
      P.chargeFx = .1; const k=P.charge, cx=P.x, cy=P.y-24*P.sc;
      addP({type:'ringin',x:cx,y:cy,size:(90+30*k)*P.sc,life:.3,color:k>.7?'#fff':'#ffb02e'});
      for (let i=0;i<3;i++){ const a=rand(0,TAU), d=60*P.sc; addP({type:'spark',x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,vx:-Math.cos(a)*d/.25,vy:-Math.sin(a)*d/.25,size:rand(2.5,4.5),life:.25,color:i%2?'#ffe14a':'#fff'}); }
      if (P.onGround) dust(P.x,P.y,1,40*k+10);
      sfx('charge');
    }
    if (P.charge>=1) doBoost();
  } else {
    if (P.charging){
      P.charging = false;
      if (P.charge>.12 && P.charge<1){ addText('Hold longer!',P.x,P.y-90*P.sc,{size:18,color:'#fff',life:.9}); sfx('fizzle'); }
    }
    P.charge = Math.max(0,P.charge-dt*3);
  }
}
function doBoost(){
  P.charging = false; P.charge = 0; P.chargeLock = true; P.boostT = BOOST_D; P.boostUses++;
  P.vy = -BOOST_V*R.boost/100; P.onGround = false; P.ground = null; P.coyote = 0; P.bouncing = true; P.glide = false; P.sq = -.45;
  shake(9); hitstop = .05; punch = .03; sfx('boost');
  addText('BOOST!',P.x,P.y-100*P.sc,{size:42,color:'#ffe14a',life:.9,vy:-60,pop:true});
  addP({type:'ring',x:P.x,y:P.y,size:130*P.sc,life:.4,color:'#ffe14a'});
  addP({type:'ring',x:P.x,y:P.y,size:80*P.sc,life:.3,color:'#fff'});
  for (let i=0;i<16;i++) addP({type:'puff',x:P.x+rand(-14,14)*P.sc,y:P.y,vx:rand(-120,120),vy:rand(60,260),size:rand(8,16)*Math.min(1.6,P.sc),life:rand(.4,.7),color:i%2?'#ffb02e':'#fff3b0',drag:2});
}
function endBoost(){
  P.boostT = 0; P.boostGrace = .35; P.boostCd = BOOST_CD; P.boostEndT = .9; P.sq = .25;
  addP({type:'ring',x:P.x,y:P.y-24*P.sc,size:110*P.sc,life:.4,color:'#9bf08a'});
  addText('Boost over!',P.x,P.y-90*P.sc,{size:20,color:'#9bf08a',life:.9});
  sfx('boostend');
}
function cancelCharge(){ P.charging = false; P.charge = 0; P.boostT = 0; }

// ---- Flying mode ----
function startFly(){

  P.fly = FLY_T; P.flyAge = 0; P.flyWarn = false; P.glide = false; P.vx = 0; P.vy = -FLY_SPEED;
  P.onGround = false; P.ground = null; P.coyote = 0; P.buffer = 0; keys.jump = false; P.sq = -.25;
  hitstop = .06; shake(5); sfx('fly'); modeFlash = 1; modeCol = '#7fe3ff';
  bigMsg = {t:3.4, txt:'Flying Mode!', sub:'Move your mouse left and right.', col:'#7fe3ff'};
  addP({type:'ring',x:P.x,y:P.y-30,size:200,life:.5,color:'#7fe3ff'});
  addP({type:'ring',x:P.x,y:P.y-30,size:120,life:.4,color:'#fff'});
  for (let i=0;i<14;i++){ const a=rand(0,TAU); addP({type:'star',x:P.x,y:P.y-30,vx:Math.cos(a)*rand(100,320),vy:Math.sin(a)*rand(100,320),g:150,size:rand(6,11),life:.9,color:i%2?'#bfefff':'#fff',vr:rand(-8,8)}); }

function endFly(){

  bigMsg = {t:2.4, txt:'Normal Controls Restored', sub:'Arrow keys are back. Floating down...', col:'#9bf08a'};
  for (let i=0;i<10;i++) addP({type:'puff',x:P.x+rand(-24,24),y:P.y-rand(0,50),vx:rand(-60,60),vy:rand(-40,20),size:rand(8,14),life:.6,color:'#d8f7ff',drag:2});
}

function moveEnemy(e, dtR){
  if (e.frozen>0) return;                       // frozen solid
  const dt = e.stun>0 ? 0 : dtR;                // stunned: no own movement
  if (e.stun>0) e.stun -= dtR;
  if (e.kvx||e.kvy){                            // water knockback
    if (e.plat){
      e.ox += e.kvx*dtR;
      if ((e.ox<6||e.ox>e.plat.w-6) && Math.abs(e.kvx)>250){ launchEnemy(e, Math.sign(e.kvx)||1, 'WASHED OFF!'); return; }
      e.ox = clamp(e.ox,4,e.plat.w-4);
    } else if (e.kind==='ghost'){ e.bx += e.kvx*dtR; e.by += e.kvy*dtR; }
    else if (e.kind==='bat'||e.kind==='tinyghost'){ e.x += e.kvx*dtR; e.by += e.kvy*dtR; }
    else if (e.kind==='minieye'){ e.ax += e.kvx*dtR; e.ay += e.kvy*dtR; }
    else { e.x += e.kvx*dtR; e.y += e.kvy*dtR; }
    const kf = Math.exp(-3.5*dtR); e.kvx *= kf; e.kvy *= kf;
    if (Math.abs(e.kvx)<8 && Math.abs(e.kvy)<8) e.kvx = e.kvy = 0;
    if (Math.random()<.6) addP({type:'drop',x:e.x+rand(-8,8),y:e.y+rand(-8,8),vx:-e.kvx*.1,vy:rand(-30,30),g:500,size:rand(2,4),life:.4,color:'#59b9ff'});
  }
  const dx = P.x-e.x, dy = (P.y-22)-e.y;
  e.lx = clamp(dx/120,-1,1); e.ly = clamp(dy/120,-1,1);
  switch(e.kind){
    case 'ghost':
      e.bx += clamp(P.x-e.bx,-1,1)*18*dt; e.by += e.vy*dt;
      e.x = e.bx + Math.sin(e.t*1.8+e.ph)*55; e.y = e.by + Math.sin(e.t*3)*6;
      break;
    case 'bat':
      e.x += e.dirx*e.sp*dt; e.by += clamp((P.y-22)-e.by,-1,1)*(e.t>.8?58:20)*dt;
      e.y = e.by + Math.sin(e.t*6)*28;
      if (e.t>1 && (e.x<-90 || e.x>W+90)) e.remove = true;
      break;
    case 'pumpkin': {
      const p=e.plat; e.ox += e.dir*55*dt;
      if (e.ox>p.w-16){ e.ox=p.w-16; e.dir=-1; } if (e.ox<16){ e.ox=16; e.dir=1; }
      e.ph += dt*5.5; const hop = Math.abs(Math.sin(e.ph)); e.yo = -hop*44;
      e.sy = hop<.12 ? 1-(.12-hop)*1.3 : 1+hop*.08; e.sx = 1/e.sy;
      e.x = p.x+e.ox; e.y = p.y-16+e.yo; break; }
    case 'slime': {
      const p=e.plat; e.cd -= dt;
      if (e.yo<0 || e.vyo<0){
        e.vyo += 1600*dt; e.yo += e.vyo*dt; e.ox += e.dir*130*dt;
        if (e.yo>=0){ e.yo=0; e.vyo=0; e.sy=.6; e.sx=1.4; }
      } else {
        e.ox += e.dir*32*dt;
        const near = Math.abs(P.x-(p.x+e.ox))<190 && Math.abs(P.y-p.y)<120;
        if (e.cd<=0 && near){ e.dir = P.x>p.x+e.ox?1:-1; e.vyo=-480; e.yo=-1; e.cd=rand(1.6,2.6); e.sy=1.45; e.sx=.7; }
      }
      const wob = Math.sin(e.t*5)*.06;
      e.sx += (1+wob-e.sx)*Math.min(1,10*dt); e.sy += (1-wob-e.sy)*Math.min(1,10*dt);
      if (e.ox>p.w-14){ e.ox=p.w-14; e.dir=-1; } if (e.ox<14){ e.ox=14; e.dir=1; }
      e.x = p.x+e.ox; e.y = p.y-13+e.yo; break; }
    case 'tinyghost':      // fast zig-zag in a line
      e.x += e.dirx*e.sp*dt; e.by += clamp((P.y-22)-e.by,-1,1)*28*dt;
      e.y = e.by + Math.sin(e.t*6+e.ph)*34;
      if (e.x<-160||e.x>W+160) e.remove = true;
      break;
    case 'booghost': {     // creeps up on you only while you look away
      e.shy = (e.x-P.x)*P.face > 0;
      if (!e.shy){ const d=Math.hypot(dx,dy)||1; e.x += dx/d*80*dt; e.y += dy/d*60*dt + Math.sin(e.t*4)*10*dt; e.jx=0; }
      else e.jx = Math.sin(e.t*50)*1.5;
      break; }
    case 'roller': {       // fast rolling, no hops
      const p=e.plat; e.ox += e.dir*150*dt;
      if (e.ox>p.w-17){ e.ox=p.w-17; e.dir=-1; } if (e.ox<17){ e.ox=17; e.dir=1; }
      e.rot += e.dir*150/17*dt;
      e.x = p.x+e.ox; e.y = p.y-17; break; }
    case 'diver': {        // hover up high, shake, dive-bomb, climb back, repeat
      const topY = camY+80;
      if (e.ds==='enter'){ e.y += (topY-e.y)*Math.min(1,2.5*dt); e.x += clamp(P.x-e.x,-1,1)*90*dt; if (Math.abs(e.y-topY)<12){ e.ds='tell'; e.timer=.8; } }
      else if (e.ds==='tell'){ e.x += clamp(P.x-e.x,-1,1)*70*dt; e.y = topY+Math.sin(e.t*40)*2.5; e.sy=1; e.timer-=dt; if (e.timer<=0) e.ds='dive'; }
      else if (e.ds==='dive'){ e.y += 560*dt; e.x += clamp(P.x-e.x,-1,1)*30*dt; e.sy=1.25; e.sx=.85; if (e.y>camY+H+40 || e.y>P.y+260){ e.ds='climb'; e.dives++; e.sy=1; e.sx=1; } }
      else if (e.ds==='climb'){ e.y -= 240*dt; if (e.y<=topY){ if (e.dives>=2) e.ds='leave'; else { e.ds='tell'; e.timer=.7; } } }
      else { e.y -= 300*dt; if (e.y<camY-120) e.remove=true; }
      break; }
    case 'lobber':         // lobbed up from below in a big arc
      e.vy += 520*dt; e.x += e.vx*dt; e.y += e.vy*dt;
      if (e.x<14){ e.x=14; e.vx=Math.abs(e.vx); } if (e.x>W-14){ e.x=W-14; e.vx=-Math.abs(e.vx); }
      e.sy = 1+clamp(Math.abs(e.vy)/1400,0,.35); e.sx = 1/e.sy;
      if (e.vy>0 && e.y>camY+H+70) e.remove = true;
      break;
    case 'minieye': {      // figure-8 loops around a slowly approaching anchor
      e.ax += clamp(P.x-e.ax,-1,1)*32*dt; e.ay += clamp((P.y-22)-e.ay,-1,1)*32*dt;
      e.x = e.ax + Math.sin(e.t*2.2+e.ph)*72; e.y = e.ay + Math.sin(e.t*4.4+e.ph)*34;
      e.blink = Math.max(0,e.blink-dt*4); if (Math.random()<dt*.5) e.blink=1;
      break; }
    case 'eyeball': {
      const d = Math.hypot(dx,dy)||1;
      e.lx = clamp(dx/d,-1,1); e.ly = clamp(dy/d,-1,1);
      e.blink = Math.max(0,e.blink-dt*4); if (Math.random()<dt*.4) e.blink=1;
      if (e.mode==='hover'){
        e.x += dx/d*70*dt; e.y += dy/d*70*dt + Math.sin(e.t*3)*20*dt;
        e.timer -= dt; if (e.timer<=0){ e.mode='tell'; e.timer=.6; }
      } else if (e.mode==='tell'){
        e.jx = Math.sin(e.t*70)*2.5; e.timer -= dt;
        if (e.timer<=0){ e.mode='dash'; e.timer=.55; e.dvx=dx/d*400; e.dvy=dy/d*400; e.jx=0; }
      } else {
        e.x += e.dvx*dt; e.y += e.dvy*dt; e.timer -= dt;
        if (e.timer<=0){ e.mode='hover'; e.timer=rand(2,3); }
      }
      e.x = clamp(e.x,10,W-10);
      break; }
  }
}

function updateEnemies(dt){
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if (e.plat && e.state==='alive' && Math.abs(e.plat.y-(camY+H/2)) > H*1.1) continue;
    e.t += dt; e.flash -= dt;
    if (state==='play' && e.state==='alive' && !seen[e.kind] && e.y>camY+30 && e.y<camY+H-30 && e.x>10 && e.x<W-10){ seen[e.kind]=true; toasts.push(e.kind); }
    if (e.state==='alive'){ statusTick(e,dt); if (e.state==='alive') moveEnemy(e,dt); }
    else if (e.state==='dying'){
      e.t2 += dt; const t=e.t2, k=e.dkind; e.tint = REACT[k].tint;
      if (k==='fire'){ e.rot = Math.sin(t*50)*.18; e.y -= 28*dt; if (Math.random()<.7) addP({type:'flame',x:e.x+rand(-10,10),y:e.y-e.r*.6,vy:-90,size:rand(5,9),life:.35,color:Math.random()<.5?'#ff7a1a':'#ffd23f'}); }
      if (k==='water'){ const f=Math.min(1,t/.35); e.sx=1+f*.7; e.sy=1-f*.62; if (Math.random()<.5) addP({type:'drop',x:e.x+rand(-14,14),y:e.y,vx:rand(-30,30),vy:-60,g:600,size:rand(2,4),life:.5,color:'#59b9ff'}); }
      if (k==='ice'){ e.rot = Math.sin(t*60)*.05; if (Math.random()<.25) addP({type:'spark',x:e.x+rand(-14,14),y:e.y+rand(-14,14),size:rand(2,4),life:.3,color:'#fff'}); }
      if (t>.55) finishDying(e);
    } else if (e.state==='launched'){
      e.t2 += dt; e.x += e.vx*dt; e.y += e.vy*dt; e.vy += 260*dt; e.rot += e.spin*dt;
      e.sc = Math.max(0,1-e.t2/1.1);
      if (Math.random()<.5) addP({type:'star',x:e.x,y:e.y,size:rand(4,7),life:.4,color:'#ffe14a',vr:5});
      if (e.t2>1.1 || e.x<-250 || e.x>W+250){
        addP({type:'ring',x:clamp(e.x,12,W-12),y:e.y,size:30,life:.4,color:'#fff'});
        addP({type:'star',x:clamp(e.x,12,W-12),y:e.y,size:12,life:.5,color:'#fff6a0',vr:3});
        e.remove = true;
      }
    }
    if (e.remove){ enemies.splice(i,1); continue; }
    if (e.state==='alive'){
      if (!e.plat && (e.y<camY-460 || e.y>camY+H+460)){ enemies.splice(i,1); continue; }
      // contact with player
      const s=P.sc, l=P.x-14*s, r=P.x+14*s, t=P.y-42*s, b=P.y-2*s;
      const nx=clamp(e.x,l,r), ny=clamp(e.y,t,b);
      if (!e.dummy && (P.giant>0 || P.fly>0 || !(e.frozen>0)) && Math.hypot(e.x-nx,e.y-ny) < e.r*.85){
        if (P.giant>0 || P.fly>0) launchEnemy(e, e.x>=P.x?1:-1, P.fly>0?'WHOOSH!':undefined); else hurtEnemy_contact(e);
      }
    }
  }
}
function hurtEnemy_contact(e){ hurtPlayer(e); }

function updateProjectiles(dt){
  for (let i=projs.length-1;i>=0;i--){
    const p = projs[i]; p.age += dt; const t = p.age/p.life;
    if (p.kind==='fire'){
      p.rr = p.r*(.75+t*.9);
      const f = Math.exp(-1.5*dt); p.vx*=f; p.vy*=f; p.vy -= 70*dt;
      if (Math.random()<.5) addP({type:'spark',x:p.x+rand(-4,4),y:p.y+rand(-4,4),vy:-60,size:rand(2,3.5),life:.35,color:'#ffd23f'});
    } else if (p.kind==='water'){
      p.vy += 300*dt; p.rot += 4*dt;
      if (Math.random()<.8) addP({type:'drop',x:p.x+rand(-p.r*.6,p.r*.6),y:p.y+rand(-p.r*.6,p.r*.6),vx:rand(-30,30),vy:rand(-10,40),g:500,size:rand(2,4.5),life:.4,color:'#59b9ff'});
      if (Math.random()<.3) addP({type:'bubble',x:p.x,y:p.y,vx:rand(-30,30),vy:rand(-40,0),size:rand(3,6),life:.5,color:'#bfe9ff'});
    } else {
      p.rot += 12*dt;
      if (Math.random()<.9) addP({type:'flake',x:p.x+rand(-4,4),y:p.y+rand(-4,4),vx:rand(-20,20),vy:rand(0,40),size:rand(3,5.5),life:.55,color:'#fff',vr:rand(-6,6)});
      if (Math.random()<.5) addP({type:'spark',x:p.x,y:p.y,size:rand(2,3.5),life:.3,color:'#9fe8ff'});
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
    let dead = p.age>p.life || p.y<camY-200 || p.y>camY+H+200 || p.x<-150 || p.x>W+150;
    if (!dead){
      for (const e of enemies){
        if (e.state!=='alive') continue;
        if (p.kind==='fire' && e.lastBurst===p.burst) continue;
        if (Math.hypot(e.x-p.x,e.y-p.y) < e.r+p.rr*.8){
          if (p.kind==='fire') e.lastBurst = p.burst;
          hurtEnemy(e,p.kind,p.x,p.y,p); dead = true; break;
        }
      }
    } else if (p.age>p.life){
      if (p.kind==='water') for(let k=0;k<6;k++) addP({type:'drop',x:p.x,y:p.y,vx:rand(-90,90),vy:rand(-120,-20),g:700,size:rand(2,4),life:.5,color:'#59b9ff'});
      if (p.kind==='fire' && Math.random()<.6) addP({type:'puff',x:p.x,y:p.y,vx:rand(-20,20),vy:-50,size:rand(6,10),life:.6,color:'#6a5a88',drag:1.5});
      if (p.kind==='ice') for(let k=0;k<5;k++) addP({type:'flake',x:p.x,y:p.y,vx:rand(-80,80),vy:rand(-80,80),size:rand(3,6),life:.5,color:'#fff',vr:4,drag:2});
    }
    if (dead) projs.splice(i,1);
  }
}

function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.age+=dt;
    if (p.age>=p.life){ particles.splice(i,1); continue; }
    if (p.drag) { const f=Math.exp(-p.drag*dt); p.vx*=f; p.vy*=f; }
    p.vy += p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot += p.vr*dt;
    if (p.type==='confetti'){ p.vx = Math.sin(p.age*5+p.rot)*60; }
  }
  for (let i=texts.length-1;i>=0;i--){
    const t=texts[i]; t.age+=dt; t.y += t.vy*dt; t.vy *= Math.exp(-1.5*dt);
    if (t.age>=t.life) texts.splice(i,1);
  }
}

function spawnAir(kind){
  const top=camY, bot=camY+H;
  if (kind==='ghost'){
    const below = Math.random()<.35, bx=rand(40,W-40), by = below?bot+40:top-40;
    enemies.push(newEnemy('ghost',bx,by,{bx,by,vy: below?-rand(50,70):rand(45,70), ph:rand(0,TAU)}));
  } else if (kind==='bat'){
    const side = Math.random()<.5?-1:1, y = clamp(P.y+rand(-220,60), top+60, bot-140);
    enemies.push(newEnemy('bat', side<0?-30:W+30, y, {dirx:-side, sp:rand(125,165), by:y}));
  } else if (kind==='tinyghost'){          // a zig-zagging trio
    const side = Math.random()<.5?-1:1, y0 = clamp(P.y+rand(-240,40), top+60, bot-140);
    for (let i=0;i<3;i++) enemies.push(newEnemy('tinyghost', side<0?-30-i*38:W+30+i*38, y0+i*10, {dirx:-side, sp:125, by:y0+i*10, ph:i*.8}));
  } else if (kind==='booghost'){
    const side = Math.random()<.5?-1:1, y = clamp(P.y+rand(-200,60), top+60, bot-140);
    enemies.push(newEnemy('booghost', side<0?-30:W+30, y, {shy:false}));
  } else if (kind==='diver'){
    enemies.push(newEnemy('diver', rand(60,W-60), top-40, {ds:'enter',timer:0,dives:0}));
  } else if (kind==='lobber'){
    enemies.push(newEnemy('lobber', rand(40,W-40), bot+30, {vx:rand(-70,70), vy:-rand(640,820)}));
  } else if (kind==='minieye'){
    const below=Math.random()<.5;
    for (let i=0;i<2;i++){ const ax=rand(60,W-60), ay=below?bot+50:top-50; enemies.push(newEnemy('minieye',ax,ay,{ax,ay,ph:i*Math.PI})); }
  } else {
    const below = Math.random()<.6, x=rand(50,W-50);
    enemies.push(newEnemy('eyeball', x, below?bot+40:top-40, {}));
  }
}

function updateGame(dt){
  if (!toast && toasts.length) toast = {kind:toasts.shift(), t:3.2};
  if (toast){ toast.t -= dt; if (toast.t<=0) toast = null; }
  updatePlatforms(dt);
  updatePlayer(dt);
  updateEnemies(dt);
  updateProjectiles(dt);

  // power-ups
  pickupT += dt;
  for (const pk of pickups){
    if (pk.taken) continue;
    const cy = P.y-24*P.sc;
    if (Math.hypot(pk.x-P.x, pk.y+Math.sin(pickupT*4)*4-cy) < 26+14*P.sc){ pk.taken = true; startGiant(); }
  }

  for (const pk of flyPicks){
    if (pk.taken) continue;
    pk.x = pk.bx + Math.sin(pickupT*1.3+pk.ph)*22; pk.y = pk.by + Math.sin(pickupT*2.1+pk.ph)*12;
    if (P.fly>0) continue;
    if (Math.hypot(pk.x-P.x, pk.y-(P.y-24*P.sc)) < 30+14*P.sc){ pk.taken = true; startFly(); }
  }
  revealT += dt; modeFlash = Math.max(0,modeFlash-dt*1.1);
  ctrlB += ((P.fly>0?1:0)-ctrlB)*Math.min(1,8*dt);
  cv.style.cursor = P.fly>0 ? 'ew-resize' : 'default';
  // camera
  let target = P.y - H*.58;
  camY += (target-camY)*Math.min(1,6*dt);
  camY = Math.min(camY, LOW_CAM); camY = Math.max(camY, GOAL.y-220);

  // spawning
  spawnT -= dt;
  const S = SECTIONS[secIdx(P.y)];
  if (spawnT<=0){
    spawnT = S.spawn*rand(.75,1.25);
    const air = enemies.filter(e=>!e.plat && e.state==='alive').length;
    if (air < S.maxAir && P.y > GOAL.y+300) spawnAir(S.air[Math.floor(Math.random()*S.air.length)]);
  }

  // sections
  const si = secIdx(P.y);
  if (si>maxSec){ maxSec=si; banner={t:3,sec:si}; sfx('start'); }
  if (!goalMsgShown && P.y < GOAL.y+700){ goalMsgShown=true; bigMsg={t:2.4,txt:'Reach the Halloween Moon!',col:'#ffe9a8'}; }

  // hint chips
  if (hint.move&&hint.jump&&hint.atk) hint.doneT += dt;

  // win
  const d = Math.hypot(P.x-GOAL.x, (P.y-24*P.sc)-GOAL.y);
  if (d < GOAL.r*.85 + 12*P.sc){
    state='win'; winT=0; P.winFromX=P.x; P.winFromY=P.y; sfx('win'); shake(8);
    for (let i=0;i<40;i++) addP({type:'star',x:GOAL.x,y:GOAL.y,vx:rand(-300,300),vy:rand(-300,300),g:200,size:rand(8,15),life:1.6,color:['#ffe14a','#ff9f1c','#6ee04f','#c58bff'][i%4],vr:rand(-8,8)});
  }
}

function step(dt){
  time += dt;
  if (state==='title'){
    titleT += dt; titleNope = Math.max(0,titleNope-dt);
    titleHover = mouseX!=null && hitMonster(mouseX,mouseY);
    cv.style.cursor = titleHover ? 'pointer' : 'default';
    P.scv = (P.scv + (P.target-P.sc)*260*dt) * Math.exp(-7*dt); P.sc += P.scv*dt;
    P.blinkT -= dt; if (P.blinkT<=0){ P.blink=.12; P.blinkT=rand(2,4); } P.blink -= dt;
    P.face = (mouseX!=null && mouseX<P.x) ? -1 : 1;
    updateParticles(dt); return;
  }
  xfade = Math.max(0, xfade-dt/.45);
  if (hitstop>0){ hitstop -= dt; return; }
  shakeMag *= Math.exp(-8*dt); if (shakeMag<.2) shakeMag=0;
  flash = Math.max(0,flash-dt*1.6); punch *= Math.exp(-6*dt); rayT = Math.max(0,rayT-dt); scorePop = Math.max(0,scorePop-dt*4);
  if (bigMsg){ if (bigMsg.max==null) bigMsg.max = bigMsg.t; bigMsg.t-=dt; if (bigMsg.t<=0) bigMsg=null; }
  if (banner){ banner.t-=dt; if (banner.t<=0) banner=null; }
  updateParticles(dt);
  if (state==='play') updateGame(dt);
  else if (state==='tutorial') updateTutorial(dt);
  else if (state==='starting'){ startT += dt; updatePlatforms(dt); updatePlayer(dt); if (startT>.9 && P.onGround) startGame(); }
  else if (state==='over'){
    overT += dt; P.vy += 1700*dt; P.y += P.vy*dt; P.rot += 9*dt; P.sc += (1-P.sc)*.1;
    updatePlatforms(dt); updateEnemies(dt);
  } else if (state==='win'){
    winT += dt;
    if (winT<3 && Math.random()<.6) addP({type:'confetti',x:rand(0,W),y:camY-10,vy:rand(80,160),size:rand(5,8),life:4,color:['#ffe14a','#ff9f1c','#6ee04f','#c58bff','#6ec6ff'][Math.floor(Math.random()*5)],vr:rand(-6,6)});
    updatePlatforms(dt);
  }
}

/* ---------- drawing: monster ---------- */
function eyePair(c,dx,y,r,m,lx,ly){
  c.strokeStyle='#201046'; c.lineCap='round';
  for (const s of [-1,1]){
    const x=s*dx;
    if (m===4){ c.lineWidth=2.5; c.beginPath(); c.moveTo(x-r*.8,y); c.lineTo(x+r*.8,y); c.stroke(); }
    else if (m===3){ const q=r*.65; c.lineWidth=2.8; c.beginPath(); c.moveTo(x-q,y-q); c.lineTo(x+q,y+q); c.moveTo(x+q,y-q); c.lineTo(x-q,y+q); c.stroke(); }
    else if (m===2){ c.lineWidth=2.8; c.beginPath(); c.arc(x,y+r*.4,r*.8,Math.PI*1.1,Math.PI*1.9); c.stroke(); }
    else {
      c.lineWidth=2; c.fillStyle='#fff'; circ(c,x,y,r); c.fill(); c.stroke();
      const pr = m===1 ? r*.3 : r*.5; c.fillStyle='#201046';
      circ(c,x+lx*r*.38,y+ly*r*.38,pr); c.fill();
      c.fillStyle='#fff'; circ(c,x+lx*r*.38-pr*.35,y+ly*r*.38-pr*.35,pr*.3); c.fill();
    }
  }
}
function mouthS(c,x,y,w,m){
  c.strokeStyle='#201046'; c.lineWidth=2; c.lineCap='round';
  if (m===1){ c.fillStyle='#4a0f2e'; el(c,x,y+2,w*.34,w*.46); c.fill(); c.stroke(); }
  else if (m===2){ c.beginPath(); c.moveTo(x-w/2,y); c.quadraticCurveTo(x-w/4,y-4,x,y); c.quadraticCurveTo(x+w/4,y+4,x+w/2,y); c.stroke(); }
  else if (m===3){ c.beginPath(); c.moveTo(x-w/2,y); c.lineTo(x+w/2,y); c.stroke(); c.fillStyle='#ff6b8a'; el(c,x+w*.15,y+3,w*.18,w*.25); c.fill(); c.stroke(); }
  else { c.beginPath(); c.arc(x,y-w*.25,w*.5,.15*Math.PI,.85*Math.PI); c.stroke(); }
}

function drawMonster(c,x,y,s,o){
  c.save(); c.translate(x,y);
  if (o.rot){ c.translate(0,-22*s); c.rotate(o.rot); c.translate(0,22*s); }
  const mood=o.mood, moving=o.walk&&!o.air;
  let sq=o.sq;
  if (!moving && !o.air && mood!=='hurt') sq += Math.sin(o.t*4)*.018;      // idle breathing
  if (mood==='surprised') sq -= .1;
  if (mood==='gulp') sq += .12;                                         // stretch up in shock
  const trem = (mood==='surprised'||mood==='fall') ? Math.sin(o.t*55)*1.2 : mood==='gulp' ? Math.sin(o.t*50)*2.4 : 0;
  c.translate(trem,0);
  c.scale(s*(1+sq)*o.face*(o.ex||1), s*(1-sq)*(o.ey||1));
  c.lineJoin='round'; c.lineCap='round';
  const dark='#1d5c1a', ink='#201046', t=o.t;
  const bob = moving ? -Math.abs(Math.sin(o.walkT*11))*2.5 : 0;
  c.lineWidth=2.6;
  // tail nub
  c.fillStyle='#4ab33a'; c.strokeStyle=dark;
  c.save(); c.translate(-22,-9); c.rotate(-.5+Math.sin(t*8)*.18); el(c,-3,0,7,3.6); c.fill(); c.stroke(); c.restore();
  // stubby legs with toes
  for (const i of [-1,1]){
    const lift = o.air ? 5 : (moving ? Math.max(0,Math.sin(o.walkT*11+(i>0?Math.PI:0)))*5 : 0);
    const dang = (o.air && mood==='fall') ? Math.sin(t*25+i*2)*3 : 0;
    const ly0 = -4-lift+dang;
    c.fillStyle='#4ab33a'; c.strokeStyle=dark; c.lineWidth=2.6; el(c,i*10,ly0,8,6.2); c.fill(); c.stroke();
    c.lineWidth=1.6; c.beginPath(); c.moveTo(i*10-2.6,ly0+1); c.lineTo(i*10-2.6,ly0+5); c.moveTo(i*10+2.6,ly0+1); c.lineTo(i*10+2.6,ly0+5); c.stroke();
  }
  c.translate(0,bob);
  // round body
  c.lineWidth=2.8; c.fillStyle='#6ee04f'; c.strokeStyle=dark; el(c,0,-25,24,22); c.fill(); c.stroke();
  c.fillStyle='rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(-13,-39,6.5,3.2,-.6,0,TAU); c.fill();
  c.fillStyle='#b9f7a0'; el(c,0,-13,13,8.5); c.fill();
  c.fillStyle='#53c43c'; circ(c,-17,-31,3); c.fill(); circ(c,18,-28,2.6); c.fill(); circ(c,15,-37,2); c.fill(); circ(c,-8,-9,2); c.fill();
  // arms
  for (const i of [-1,1]){
    let ax=i*24.5, ay=-22, rx=5.8, ry=4.8;
    if (mood==='hurt'){ ax=i*27; ay=-42+Math.sin(t*30+i)*4; }
    else if (mood==='happy'){ ax=i*25; ay=-38+Math.sin(t*14+i)*3; }
    else if (mood==='jump'){ ax=i*26; ay=-39; }
    else if (mood==='fall'){ ax=i*28; ay=-34+Math.sin(t*28+i)*5; }
    else if (mood==='surprised'){ ax=i*27; ay=-41+Math.sin(t*50+i)*1.5; }
    else if (mood==='atk'){ if (i===1){ ax=30; ay=-27; rx=7; ry=5.5; } else { ax=-26; ay=-33; } }

function drawEnemy(e){
  if (e.plat && e.state==='alive' && Math.abs(e.plat.y-(camY+H/2)) > H*1.1) return;
  const m = e.state==='launched' ? 3 : e.state==='dying' ? (e.dkind==='water'?2:1)
          : e.stun>0 ? 3 : e.flash>0 ? 3 : (e.burn>0||e.frozen>0) ? 1 : 0;
  ctx.save();
  ctx.translate(e.x+(e.jx||0), e.y);
  ctx.rotate(e.rot||0);
  ctx.scale((e.sc||1)*(e.sx||1), (e.sc||1)*(e.sy||1));
  drawEnemyBody(ctx,e,m);
  if (e.state==='alive'){
    if (e.wetT>0){   // soaked: blue sheen + drips
      ctx.globalAlpha=.32*clamp(e.wetT,0,1); ctx.fillStyle='#4fb8ff'; circ(ctx,0,0,e.r+1); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle='#59b9ff'; for (let i=0;i<3;i++){ const dy=((e.t*40+i*9)%14); el(ctx,-8+i*8,e.r*.5+dy,2,3.2); ctx.fill(); }
    }
    if (e.burn>0){   // on fire: flickering orange glow
      ctx.globalAlpha=.35+.15*Math.sin(e.t*30); ctx.fillStyle='#ff6a00'; circ(ctx,0,0,e.r+4); ctx.fill(); ctx.globalAlpha=1;
    }

    if (e.stun>0){   // dizzy stars
      ctx.fillStyle='#ffe14a'; ctx.strokeStyle='#7a3a00'; ctx.lineWidth=1.2;
      for (let i=0;i<3;i++){ const aa=e.t*7+i*2.1; star(ctx,Math.cos(aa)*e.r*.9,-e.r-8+Math.sin(aa)*4,4.5,aa); ctx.fill(); ctx.stroke(); }
    }
  }
  if (e.frozen>0 || (e.state==='dying' && e.dkind==='ice')){
    const k = e.frozen>0 ? Math.min(1,e.fz/.18) : 1, sc = (.5+.5*k)+Math.sin(k*Math.PI)*.12, q=e.r+5;
    ctx.save(); ctx.scale(sc,sc);
    ctx.fillStyle='rgba(170,235,255,.5)'; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=3;
    rr(ctx,-q,-q,q*2,q*2,8); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-q+3,-q+10); ctx.lineTo(-q+11,-q+3); ctx.moveTo(-q+3,-q+17); ctx.lineTo(-q+17,-q+3); ctx.stroke();
    ctx.strokeStyle='rgba(120,200,235,.9)'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(q-4,q-14); ctx.lineTo(q-10,q-8); ctx.lineTo(q-5,q-3); ctx.stroke();
    if (e.frozen>0 && e.frozen<.8){ ctx.beginPath(); ctx.moveTo(-3,-q); ctx.lineTo(2,-4); ctx.lineTo(-5,4); ctx.lineTo(1,q); ctx.moveTo(2,-4); ctx.lineTo(q,-6); ctx.stroke(); }
    ctx.restore();
  }
  if (e.state==='dying' && e.dkind==='water' && e.t2>.15){
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.fillStyle='rgba(110,198,255,.25)'; ctx.lineWidth=2.5; circ(ctx,0,0,e.r+8); ctx.fill(); ctx.stroke();
  }

}

function drawPlayer(){
  if (state==='tutorial' && tutPose){ drawTutPlayer(tutPose); return; }
  const s=P.sc, cy0=P.y-24*s;
  const fly = P.fly>0;
  // look at the nearest enemy, else along the movement direction (at the title: at the mouse)
  let tgt=null, bd=320;
  if (state==='play' || state==='over' || state==='tutorial'){
    for (const e of enemies){ if (e.state!=='alive') continue; const d=Math.hypot(e.x-P.x,e.y-cy0); if (d<bd){bd=d;tgt=e;} }
  }
  let lx = (keys.right-keys.left)*P.face || .35, ly = P.vy<-100 ? -.6 : .25;
  if (tgt){ lx = clamp((tgt.x-P.x)/80,-1,1)*P.face; ly = clamp((tgt.y-cy0)/80,-1,1); }
  if (state==='title' && mouseX!=null){ lx = clamp((mouseX-P.x)/60,-1,1)*P.face; ly = clamp((mouseY-(cy0-camY))/60,-1,1); }
  const air = !P.onGround;
  let mood='normal';
  if (state==='over' || (P.moodT>0 && P.mood==='hurt')) mood='hurt';
  else if (P.boostT>0) mood='jump';
  else if ((P.gulpT>0 && P.giant>0) || P.charge>.05) mood='gulp';
  else if (P.atk>0) mood='atk';
  else if (P.moodT>0 && P.mood==='surprised') mood='surprised';
  else if (P.happyT>0) mood='happy';
  else if (tgt && bd<115 && P.giant<=0 && state==='play') mood='surprised';
  else if (P.giant>0) mood='giant';
  else if (fly) mood='jump';
  else if (air && P.vy<-120) mood='jump';
  else if (air && P.vy>260 && !P.glide) mood='fall';
  if (state==='title') mood = titleNope>0 ? 'surprised' : titleHover ? 'jump' : 'normal';
  let px=P.x, py=P.y, ps=s, rot=P.rot, sq=P.sq;
  if (P.atk>0) sq = Math.max(sq,.07);   // little recoil squash
  if (P.charge>.02){   // stored energy: compress, pulse faster and shake harder as it fills
    const k=P.charge; sq += Math.sin(time*(14+k*40))*(.03+.07*k) + .05*k; px += Math.sin(time*90)*k*2.5*ps;
  }
  if (state==='title'){
    rot = titleHover ? Math.sin(time*14)*.1 : Math.sin(time*2)*.03;
    py -= titleHover ? Math.abs(Math.sin(time*7))*16 : 0;
    sq += titleHover ? Math.sin(time*14)*.03 : 0;

function drawProjectiles(){

    const t=p.age/p.life, a=Math.atan2(p.vy,p.vx);
    if (p.kind==='fire'){
      // teardrop flame, three layers, tail trailing behind
      const r=p.rr, fade=Math.min(1,(1-t*.75)*1.4);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(a); ctx.globalAlpha=fade;
      for (const [col,k] of [['#e8420a',1],['#ff8a1f',.72],['#ffd23f',.42]]){
        const rk=r*k, wob=Math.sin(time*40+p.x)*rk*.15;
        ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,-rk);
        ctx.quadraticCurveTo(-rk*1.2,-rk*.6+wob,-rk*2.4,wob); ctx.quadraticCurveTo(-rk*1.2,rk*.6+wob,0,rk);
        ctx.arc(0,0,rk,Math.PI/2,-Math.PI/2,true); ctx.closePath(); ctx.fill();

function drawParticles(){

    const t=p.age/p.life;
    ctx.save(); ctx.translate(p.x,p.y);
    switch(p.type){
      case 'star': ctx.fillStyle=p.color; ctx.strokeStyle='#7a3a00'; ctx.lineWidth=1.5; ctx.globalAlpha=Math.min(1,(1-t)*2); star(ctx,0,0,p.size*(1-t*.4),p.rot); ctx.fill(); ctx.stroke(); break;
      case 'ring': ctx.globalAlpha=1-t; ctx.strokeStyle=p.color; ctx.lineWidth=2+6*(1-t); circ(ctx,0,0,p.size*(.2+.8*t)); ctx.stroke(); break;
      case 'puff': ctx.globalAlpha=(1-t)*.85; ctx.fillStyle=p.color; circ(ctx,0,0,p.size*(.6+.6*t)); ctx.fill(); break;
      case 'flame': ctx.globalAlpha=1-t; ctx.fillStyle=p.color; circ(ctx,0,0,p.size*(1-t*.6)); ctx.fill(); break;

      case 'spark': ctx.globalAlpha=1-t; ctx.fillStyle=p.color; circ(ctx,0,0,p.size*(1-t*.5)); ctx.fill(); break;
      case 'ringin': ctx.globalAlpha=.3+.7*t; ctx.strokeStyle=p.color; ctx.lineWidth=2+3*t; circ(ctx,0,0,p.size*(1-t*.9)); ctx.stroke(); break;
      case 'wave': ctx.globalAlpha=1-t; ctx.fillStyle=p.color; el(ctx,0,-5*(1-t),p.size*(.4+t*.8),9*(1-t)+3); ctx.fill(); break;
      case 'line': ctx.rotate(Math.atan2(p.vy,p.vx)); ctx.globalAlpha=1-t; ctx.strokeStyle=p.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-p.size,0); ctx.lineTo(p.size,0); ctx.stroke(); break;
      case 'flake': ctx.rotate(p.rot); ctx.globalAlpha=1-t; ctx.strokeStyle=p.color; ctx.lineWidth=1.6; ctx.beginPath(); for (let k=0;k<3;k++){ const b=k*Math.PI/3; ctx.moveTo(Math.cos(b)*p.size,Math.sin(b)*p.size); ctx.lineTo(-Math.cos(b)*p.size,-Math.sin(b)*p.size); } ctx.stroke(); break;

    }

}

/* ======================================================================
   TUTORIAL — the four steps of Monster's Journey, played before the game.
   Behaviour constants are ported from the interaction studies:
     Step 1 Wake the Monster  (wake.js)   spongy  press/release springs
     Step 2 Steer + Fire      (fire.js)   snappy  real game controls + study feedback
     Step 3 Glide to Steer    (glide.js)  light   spring glide toward the mouse
     Step 4 Charge + Burst    (burst.js)  springy hold, swell, burst, land
   Only the current step's input is live; the next step unlocks on success.
   ====================================================================== */
const TUT_NAMES = ['Wake the Monster','Steer + Fire','Glide to Steer','Charge + Burst'];
const TUT_FEEL = ['Spongy','Snappy','Light','Springy'];
const TUT_SUB = ['Click the monster to wake it up.','Move, jump and zap the target!','Grab the wings, then steer with your mouse.','Hold to charge, then burst up to the exit!'];
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const touchEl = document.getElementById('touch');
let tut = null, tutPose = null, xfade = 0;
// Charge + Burst geometry (study values, sized to the green monster)
const TB = {HOLD:1.0, GROW:.45, g:3600, W0:48, h0:50, RISE:150, LOW:-480};

// damping ratio that gives a spring the requested peak overshoot (%), relative to critical damping
function dampingFor(os){ if (os<=.5) return 1; const l = Math.log(os/100); return -l/Math.sqrt(Math.PI*Math.PI+l*l); }
function tutPlat(x,y,w,extra){ return Object.assign({type:'stone',x,y,w,h:16,bx:x,dx:0,sec:0,sp:1,ph:x*.013,amp:0,state:'idle',t:0,fy:0,squish:0},extra||{}); }
function setTouch(on){ touchEl.classList.toggle('off', !on); }
const easeRipple = (() => {           // cubic-bezier(.15,.6,.3,1), the Wake ripple's curve
  const at=(a1,a2,t)=>3*a1*t*(1-t)*(1-t)+3*a2*t*t*(1-t)+t*t*t;
  return x => { let lo=0,hi=1,t=x; for (let i=0;i<22;i++){ t=(lo+hi)/2; if (at(.15,.3,t)<x) lo=t; else hi=t; } return at(.6,1,t); };
})();

function startTutorial(){

  platforms = [platforms[0]]; enemies = []; pickups = []; flyPicks = []; projs = [];
  camY = LOW_CAM; P.x = W/2; P.y = 0; P.ground = platforms[0]; P.onGround = true;
  keys.left = keys.right = keys.jump = false; mouseDown = false; touchIds.clear();
  tut = { step:1, t:0, stepT:0, ovA:1, banner:{t:3}, next:null, toMain:null, ripples:[], zT:1.2,
    w:{q:0,qv:0,target:0,k:160,c:2*Math.sqrt(160),pressed:false,pending:false,id:null,awake:false,mix:0,phase:0,period:4.6,amp:.03} };
  tutPose = null; setTouch(false); cv.style.cursor = 'default';
}
function tutMoveOK(){ return !!tut && (tut.step===2 || (tut.step===3 && !tut.flying && !tut.landed)); }

/* ---------- input (called from the game's existing listeners) ---------- */
function tutPress(k){

  else if (k==='fire' && tut.step===2){
    const before = P.atkCd; attack();

function tutPointerDown(e,q){

}
function tutPointerUp(e){ if (tut && tut.step===1 && tut.w.id!==null && e.pointerId===tut.w.id) wakeRelease(); }

/* ---------- Step 1: Wake the Monster (spongy) ---------- */
function wakePress(){
  const w = tut.w; if (w.pressed) return;
  w.pressed = true; w.pending = false; w.target = 1; w.k = 380; w.c = 30;      // stiff squash on contact
  tone(210,120,.12,'sine',.08);
}
function wakeRelease(){
  const w = tut.w; if (!w.pressed) return;
  if (w.q < .7 && !reduceMotion){ w.pending = true; return; }                 // a quick tap still squashes to 70%
  w.pending = false; w.pressed = false; w.id = null;
  w.target = 0; w.k = 80; w.c = reduceMotion ? 2*Math.sqrt(80) : 2*Math.sqrt(80)*dampingFor(R.wakeOvershoot);   // soft rebound, one overshoot (7.6 at the final 22.9%)
  tut.ripples.push({age:reduceMotion?0:-.14});
  sfx('bounce');
  if (!w.awake){
    w.awake = true; P.happyT = 1.4; sfx('start');
    addText('I’M AWAKE!', P.x, P.y-205, {size:30,color:'#6ee04f',life:1.3,pop:true});
    for (let i=0;i<10;i++){ const a=rand(0,TAU); addP({type:'star',x:P.x,y:P.y-70,vx:Math.cos(a)*rand(120,300),vy:Math.sin(a)*rand(120,300)-60,g:300,size:rand(6,11),life:.9,color:i%2?'#ffe14a':'#9bf08a',vr:rand(-8,8)}); }
    tut.next = {step:2, t:1.7};

}
function tutWake(dt){
  const w = tut.w;
  const n = Math.max(1,Math.ceil(dt*240)), h = dt/n;
  for (let i=0;i<n;i++){ w.qv += (-w.k*(w.q-w.target) - w.c*w.qv)*h; w.q += w.qv*h; }
  if (w.pending && w.q>=.7) wakeRelease();
  w.mix = w.awake ? Math.min(1,w.mix+dt/.9) : 0;                               // colour fades back in over 0.9 s
  const tp = w.awake ? 3.2 : 4.6, ta = reduceMotion ? 0 : (w.awake ? .038 : .03), ez = Math.min(1,dt*1.5);
  w.period += (tp-w.period)*ez; w.amp += (ta-w.amp)*ez; w.phase += dt*TAU/w.period;
  const br = Math.sin(w.phase)*w.amp*(1-Math.min(1,Math.abs(w.q)*1.5));
  const pop = 1+Math.max(0,-w.q)*.1, sk = R.wakeSquash/27;
  P.scv = (P.scv + (P.target-P.sc)*260*dt)*Math.exp(-7*dt); P.sc += P.scv*dt;
  P.blinkT -= dt; if (P.blinkT<=0){ P.blink=.12; P.blinkT=rand(2,4); } P.blink -= dt; P.happyT -= dt;
  titleT += dt; titleNope = Math.max(0,titleNope-dt);

  cv.style.cursor = titleHover ? 'pointer' : 'default';
  if (mouseX!=null) P.face = mouseX<P.x ? -1 : 1;
  if (!w.awake){ tut.zT -= dt; if (tut.zT<=0){ tut.zT = 1.3; addText('z', P.x+34*P.sc*P.face, P.y-82*P.sc, {size:20+Math.random()*8,color:'#c58bff',life:1.6,vy:-35}); } }
  const mood = !w.awake ? 'sleep' : w.pressed ? 'surprised' : P.happyT>0 ? 'happy' : 'normal';
  tutPose = {x:P.x+(titleNope>0?Math.sin(time*60)*3:0), y:P.y, s:P.sc, ex:(1+.16*sk*w.q)*(1+br*.8)*pop, ey:(1-.27*sk*w.q)*(1+br*1.2)*pop,
             mood, dim:1-w.mix, halo:!tut.next, shadow:true};
}

function setupGlide(){

  if (T.ledge){ dust(T.ledge.x+75,T.ledge.y,10,110); addP({type:'ring',x:T.ledge.x+75,y:T.ledge.y-20,size:120,life:.4,color:'#d9c7ff'}); }

function tutStartFly(){

}
function tutGlide(dt){
  const T = tut;
  T.pick.x = T.pick.bx + Math.sin(pickupT*1.3)*16; T.pick.y = T.pick.by + Math.sin(pickupT*2.1)*8;
  if (!T.flying && !T.landed){
    updatePlatforms(dt); updatePlayer(dt);
    if (!T.pick.taken && Math.hypot(T.pick.x-P.x, T.pick.y-(P.y-24*P.sc)) < 30+14*P.sc) tutStartFly();
    tutPose = null; return;
  }
  if (T.landed){             // resting on the checkpoint, wings folding away
    T.wing = Math.max(0,T.wing-dt*2.5);
    P.blinkT -= dt; if (P.blinkT<=0){ P.blink=.12; P.blinkT=rand(2,4); } P.blink -= dt; P.happyT -= dt;
    P.sq += (0-P.sq)*Math.min(1,14*dt);
    tutPose = {x:P.x, y:P.y, s:1, sq:P.sq, mood:P.happyT>0?'happy':'normal', wing:T.wing, shadow:true};
    tutCam(dt, Math.min(LOW_CAM, P.y-H*.62), 3); return;
  }
  // ---- flying: the glide study's springs, steered by the mouse x only ----
  const f = T.f;
  if (mouseX!=null) f.tx = clamp(mouseX,30,W-30);
  const L = R.flyEase/100;                         // lightness: softer spring and a little more drift when higher
  const kx = 13/L, cx = reduceMotion ? 2*Math.sqrt(kx) : 5.4/Math.pow(L,.8), ka = 45, ca = reduceMotion ? 2*Math.sqrt(45) : 5.5;
  const goal = T.gi<T.gates.length ? T.gates[T.gi] : {x:T.cp.x+T.cp.w/2, y:T.cp.y-24, cp:true};
  const aligned = Math.abs(f.x-goal.x) < (goal.cp ? 60 : 34);
  // rise toward the next ring only when lined up with it; otherwise hover just below
  const fy = goal.cp ? (aligned ? T.cp.y : T.cp.y+90) : goal.y+24+(aligned ? 0 : 100);
  const n = Math.max(1,Math.ceil(dt*240)), h = dt/n;
  for (let i=0;i<n;i++){
    f.txs += (f.tx-f.txs)*(1-Math.exp(-h*(reduceMotion?20:7/L)));         // takes the jitter out of the cursor
    f.vx += (-kx*(f.x-f.txs) - cx*f.vx)*h; f.x += f.vx*h;                // soft, floaty pull toward the pointer
    const lt = reduceMotion ? 0 : clamp(f.vx*.024,-18,18);
    f.av += (-ka*(f.ang-lt) - ca*f.av)*h; f.ang += f.av*h;               // lean swings gently into travel
    f.vy += (-6*(f.y-fy) - 4.4*f.vy)*h; f.y += f.vy*h;                   // light vertical drift
  }
  const motion = clamp((Math.abs(f.vx)+Math.abs(f.tx-f.x)*3)/(W*.35),0,1);
  f.energy += (motion-f.energy)*(1-Math.exp(-dt*(motion>f.energy?6:.9)));
  f.bobPh += dt*TAU/(reduceMotion?5:3.8-.9*f.energy); f.swayPh += dt*TAU/5.6;
  const bk = R.flyBob/100;
  f.bob = (Math.sin(f.bobPh)+.18*Math.sin(f.bobPh*2+1.2))*(reduceMotion?3:9*bk)*(1-.4*f.energy);
  f.sway = reduceMotion ? 0 : Math.sin(f.swayPh)*6*bk*(1-.7*f.energy);
  const idleLean = reduceMotion ? 0 : Math.cos(f.swayPh)*2.4*bk*(1-.7*f.energy);
  P.x = f.x + f.sway; P.y = f.y; P.vx = f.vx; if (Math.abs(f.vx)>30) P.face = f.vx>0 ? 1 : -1;
  T.wing = Math.min(1,T.wing+dt*6);
  P.blinkT -= dt; if (P.blinkT<=0){ P.blink=.12; P.blinkT=rand(2,4); } P.blink -= dt;
  if (Math.random()<dt*20) addP({type:'spark',x:P.x+rand(-10,10),y:P.y+rand(-4,6),vy:60,size:rand(3,5),life:.5,color:Math.random()<.5?'#bfefff':'#fff'});
  const speed = reduceMotion ? 0 : Math.min(1,Math.abs(f.vx)/900);
  tutPose = {x:P.x, y:P.y+f.bob, s:1, ex:1+speed*.04, ey:1-speed*.04, rot:(f.ang+idleLean)*Math.PI/180, mood:'jump', wing:T.wing, air:true};
  cv.style.cursor = 'ew-resize';
  tutCam(dt, Math.min(LOW_CAM, P.y-H*.62), 3);
  if (!goal.cp){
    if (Math.hypot(P.x-goal.x, (P.y-24)-goal.y) < 30){
      T.gi++; sfx('ice'); shake(3);
      addP({type:'ring',x:goal.x,y:goal.y,size:110,life:.45,color:'#7fe3ff'});
      for (let i=0;i<10;i++){ const a=rand(0,TAU); addP({type:'star',x:goal.x,y:goal.y,vx:Math.cos(a)*rand(80,220),vy:Math.sin(a)*rand(80,220),g:150,size:rand(5,9),life:.7,color:i%2?'#bfefff':'#fff',vr:rand(-8,8)}); }
      addText(T.gi<T.gates.length ? 'WHOOSH!' : 'NOW THE CHECKPOINT!', goal.x, goal.y-40, {size:22,color:'#7fe3ff',life:1.1,pop:true});
    }
  } else if (aligned && Math.abs(f.y-T.cp.y)<5 && Math.abs(f.vy)<60){
    // touch down on the checkpoint: flying ends
    T.flying = false; T.landed = true; P.y = T.cp.y; P.onGround = true; P.ground = T.cp; P.sq = .25; P.happyT = 1;
    sfx('poof'); modeFlash = 1; modeCol = '#9bf08a'; dust(P.x,P.y,6,70); cv.style.cursor = 'default';
    bigMsg = {t:2.2, txt:'Checkpoint!', sub:'Flying Mode off. Wings away!', col:'#9bf08a'};
    for (let i=0;i<10;i++) addP({type:'puff',x:P.x+rand(-24,24),y:P.y-rand(0,50),vx:rand(-60,60),vy:rand(-40,20),size:rand(8,14),life:.6,color:'#d8f7ff',drag:2});
    tut.next = {step:4, t:1.1};
  }
}
function tutCam(dt, target, rate){ camY += (target-camY)*Math.min(1,rate*dt); }

/* ---------- Step 4: Charge + Burst (springy) ---------- */
function setupBurst(){
  const T = tut;
  T.exit = tutPlat(W/2-75, TB.LOW-TB.RISE, 150, {exit:true}); platforms.push(T.exit);
  T.ch = {state:'walk', x0:P.x, walkT:0, idx:0, py:TB.LOW, vy:0, charge:0, grow:0, sq:0, sqv:0, sqT:0, contact:0, armed:false,
          pulsePh:0, pulseRate:TAU/2.6, pulseAmp:.018, jumpV:800, trail:[], rings:[], trailAcc:0, fxT:0, wasActive:false, done:false, dx:0, dy:0, sx:1, sy:1};
  T.wing = 0; mouseDown = false; touchIds.clear();
  addP({type:'ring',x:W/2,y:T.exit.y-30,size:150,life:.5,color:'#ffe14a'});
}
function tutBurst(dt){
  const T = tut, c = T.ch;
  tutCam(dt, TB.LOW-470, 3);
  P.blinkT -= dt; if (P.blinkT<=0){ P.blink=.12; P.blinkT=rand(2,4); } P.blink -= dt; P.happyT -= dt;
  if (c.state==='walk'){                       // shuffle to the middle of the lower platform
    c.walkT = Math.min(1,c.walkT+dt/.55); const e = c.walkT*c.walkT*(3-2*c.walkT);
    const nx = lerp(c.x0,W/2,e); P.vx = (nx-P.x)/Math.max(dt,1e-3); P.x = nx; P.walkT += dt*Math.abs(P.vx)/200;
    if (Math.abs(P.vx)>20) P.face = P.vx>0 ? 1 : -1;
    if (c.walkT>=1){ c.state = 'idle'; P.vx = 0; }
    tutPose = {x:P.x, y:c.py, s:1, walk:Math.abs(P.vx)>20, mood:'normal', shadow:true}; return;
  }
  const holding = chargeHeld() && !c.done;
  if (!holding) c.armed = true;                          // a fresh press is needed for each charge
  const active = holding && c.armed && c.state==='idle';
  c.contact += ((active?1:0)-c.contact)*(1-Math.exp(-dt*(active?30:6)));
  const building = c.state==='idle' && (active || c.charge>0);
  const rateT = building ? TAU*(1.8+10*c.charge) : TAU/2.6;
  const ampT = reduceMotion ? .006 : (building ? .015+.05*c.charge : .018);
  c.pulseRate += (rateT-c.pulseRate)*(1-Math.exp(-dt*10)); c.pulseAmp += (ampT-c.pulseAmp)*(1-Math.exp(-dt*10));
  c.pulsePh += c.pulseRate*dt;
  if (c.state==='idle'){
    if (active){
      if (!c.wasActive) addText('Charging!', W/2, c.py-95, {size:22,color:'#ffe14a',life:.9,pop:true});
      c.charge = Math.min(1, c.charge+dt/R.chargeTime);
      c.fxT -= dt;
      if (c.fxT<=0){ c.fxT=.1; P.charge=c.charge; sfx('charge'); addP({type:'ringin',x:W/2,y:c.py-26,size:(90+30*c.charge),life:.3,color:c.charge>.7?'#fff':'#ffb02e'}); dust(W/2,c.py,1,40*c.charge+10); }
      if (c.charge>=1) tutLaunch();
    } else if (c.charge>0){
      if (c.wasActive && c.charge<1){ addText('Hold longer!', W/2, c.py-95, {size:18,color:'#fff',life:.9}); sfx('fizzle'); }
      c.charge = Math.max(0, c.charge-dt*.8);              // too early: ease back slowly, no launch
    }
    if (c.state==='idle'){
      if (c.charge>0 || active) c.grow = c.charge; else c.grow *= Math.exp(-dt*7);
      c.sqT = active ? 1-.85*c.charge : 0;
    }
  }
  c.wasActive = active;
  if (c.state==='flight'){
    const prev = c.py, upTop = T.exit.y;
    c.vy += TB.g*dt; c.py += c.vy*dt; c.grow *= Math.exp(-dt*5); c.sqT = 0;
    if (c.vy>=0){ if (prev<=upTop+2 && c.py>=upTop) tutLand(1); else if (prev<=TB.LOW+2 && c.py>=TB.LOW) tutLand(0); }
    if (c.state==='flight' && c.py>TB.LOW+4) tutLand(0);
    if (c.state==='flight' && !reduceMotion && c.vy<.35*c.jumpV){
      c.trailAcc += Math.abs(c.vy)*dt;
      if (c.trailAcc>TB.h0*.3){ c.trailAcc=0; const gs=1+R.chargeGrow/100*Math.pow(c.grow,1.3); c.trail.push({y:c.py,w:TB.W0*gs*.9,h:TB.h0*gs*.9,age:0}); if (c.trail.length>8) c.trail.shift(); }
    }
  }
  const n = Math.max(1,Math.ceil(dt*240)), h = dt/n;
  for (let i=0;i<n;i++){ c.sqv += (-480*(c.sq-c.sqT) - 34*c.sqv)*h; c.sq += c.sqv*h; }
  for (let i=c.trail.length-1;i>=0;i--){ c.trail[i].age += dt; if (c.trail[i].age>=.35) c.trail.splice(i,1); }
  for (let i=c.rings.length-1;i>=0;i--){ c.rings[i].age += dt; if (c.rings[i].age>=c.rings[i].dur) c.rings.splice(i,1); }
  // body: swells with the charge, pulses faster, trembles; stretches in flight, squashes on landing
  const gs = 1+R.chargeGrow/100*Math.pow(c.grow,1.3);
  const pulse = c.state==='idle' ? 1+c.pulseAmp*Math.sin(c.pulsePh) : 1;
  const fl = c.state==='flight' ? clamp(-c.vy/c.jumpV,-1,1) : 0, vs = Math.abs(fl)*(fl>0?.38:.16);
  const q = reduceMotion ? c.sq*.4 : c.sq;
  c.sx = gs*pulse*(1+.08*q)*(1-.55*vs); c.sy = gs*pulse*(1-.14*q)*(1+vs);
  const vib = (!reduceMotion && c.state==='idle') ? Math.pow(c.grow,1.2)*TB.W0*.055 : 0;
  c.dx = vib ? Math.sin(time*(40+100*c.grow))*vib : 0; c.dy = vib ? Math.cos(time*(52+110*c.grow))*vib*.4 : 0;
  P.x = W/2; P.y = c.py; P.charge = c.charge;
  const mood = c.done ? 'happy' : c.state==='flight' ? (c.vy<0?'jump':'fall') : c.charge>.05 ? 'gulp' : P.happyT>0 ? 'happy' : 'normal';
  tutPose = {x:W/2+c.dx, y:c.py+c.dy, s:1, ex:c.sx, ey:c.sy, mood, aura:c.state==='idle'?c.charge:0, shadow:c.state==='idle', air:c.state==='flight'};
}
function tutLaunch(){
  const c = tut.ch;
  c.state = 'flight'; c.armed = false;
  // clears the exit ledge (always: the extra height stays positive at every boost setting), or hops in place on it
  const jumpH = c.idx===0 ? TB.RISE+TB.h0*.5*Math.max(.4,R.boost/100) : TB.RISE*.9*R.boost/100;
  c.jumpV = Math.sqrt(2*TB.g*jumpH); c.vy = -c.jumpV;
  c.grow = 1; c.charge = 0; c.sq = -1.2; c.sqv = 0; c.sqT = 0; c.trailAcc = 0;
  c.rings.push({y:c.py,from:TB.W0*.3,to:TB.W0*1.6,age:0,dur:.35});
  if (!reduceMotion) c.trail.push({y:c.py,w:TB.W0*1.2,h:TB.h0*1.3,age:0});
  shake(9); hitstop = .05; punch = .03; sfx('boost');
  addText('BURST!', W/2, c.py-110, {size:40,color:'#ffe14a',life:.9,vy:-60,pop:true});
  addP({type:'ring',x:W/2,y:c.py,size:130,life:.4,color:'#ffe14a'});
  for (let i=0;i<14;i++) addP({type:'puff',x:W/2+rand(-14,14),y:c.py,vx:rand(-120,120),vy:rand(60,240),size:rand(8,15),life:rand(.4,.7),color:i%2?'#ffb02e':'#fff3b0',drag:2});
}
function tutLand(i){
  const T = tut, c = T.ch, from = c.idx;
  c.idx = i; c.py = i===0 ? TB.LOW : T.exit.y; c.vy = 0; c.state = 'idle';
  c.sq = .85; c.sqv = 0;                                            // lands with a squash
  c.rings.push({y:c.py,from:TB.W0*.3,to:TB.W0*1.2,age:0,dur:.3});
  sfx('bounce'); dust(W/2,c.py,6,90); shake(4);

    T.next = {main:true, t:2.0};
