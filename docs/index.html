/* ---------- sequencing ---------- */
function updateTutorial(dt){
  const T = tut; T.t += dt; T.stepT += dt; pickupT += dt;
  modeFlash = Math.max(0, modeFlash-dt*1.1);
  if (T.banner){ T.banner.t -= dt; if (T.banner.t<=0) T.banner = null; }
  if (T.step>1) T.ovA = Math.max(0, T.ovA-dt/.7);
  for (let i=T.ripples.length-1;i>=0;i--){ T.ripples[i].age += dt; if (T.ripples[i].age >= (reduceMotion?.5:1.7)) T.ripples.splice(i,1); }
  if (T.step===1) tutWake(dt);
  else if (T.step===2) tutFire(dt);
  else if (T.step===3) tutGlide(dt);
  else tutBurst(dt);
  if (T.next){
    T.next.t -= dt;
    if (T.next.t<=0){
      const nx = T.next; T.next = null;
      if (nx.main) T.toMain = 0;
      else { T.step = nx.step; T.stepT = 0; T.banner = {t:2.6}; bigMsg = null; sfx('start');
        if (nx.step===2) setupFire(); else if (nx.step===3) setupGlide(); else setupBurst(); }
    }
  }
  if (T.toMain!=null){ T.toMain += dt; if (T.toMain>=.35) enterMainGame(); }
}
// Straight into the existing game: fresh level, Section 1 banner, normal controls.
function enterMainGame(){
  tut = null; tutPose = null;
  resetGame();
  P.sc = 1; P.target = 1; P.scv = 0; P.happyT = 1.2;
  startGame();
  setTouch(true); cv.style.cursor = 'default';
  xfade = 1;
}

function drawTutFront(){

    T.ripples.forEach(r => {

    });
  }
  if (T.step===2 && T.dummy && !T.did.hit && T.dummy.state==='alive') cueArrow(T.dummy.x, T.dummy.y-48);
  if (T.step===3){

      const g = T.gi<T.gates.length ? T.gates[T.gi] : {x:T.cp.x+T.cp.w/2, y:T.cp.y-40};

      ctx.beginPath(); ctx.moveTo(W/2,TB.LOW-TB.h0-60); ctx.lineTo(W/2,T.exit.y-TB.h0-30); ctx.stroke(); ctx.restore();

  for (const e of enemies) if (e.y>camY-80 && e.y<camY+H+80 || e.state==='launched') drawEnemy(e);

  if (state==='tutorial'){ if (tut.ovA>0){ ctx.fillStyle=`rgba(10,5,35,${.62*tut.ovA})`; ctx.fillRect(-100,camY-100,W+200,H+200); } drawTutBack(); }
  drawPlayer();
  if (state==='tutorial') drawTutFront();
  drawProjectiles();
  drawParticles();
  drawTexts();
  ctx.restore();
  if (rayT>0 && state==='play'){
    const rx=P.x, ry=P.y-24*P.sc-camY, al=clamp(rayT/.5,0,1)*.6;
    ctx.save(); ctx.globalAlpha=al;
    for (let i=0;i<22;i++){ const a=i/22*TAU+time*.6; ctx.fillStyle = i%2?'#ffe14a':'#ff9f1c'; ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx+Math.cos(a)*700,ry+Math.sin(a)*700); ctx.lineTo(rx+Math.cos(a+.11)*700,ry+Math.sin(a+.11)*700); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  if (P.fly>0 && state==='play') drawFlyGuide();
  if (flash>0){ ctx.fillStyle=`rgba(255,225,120,${flash*.7})`; ctx.fillRect(0,0,W,H); }
  if (state==='title' || state==='starting') drawTitle(titleFade());
  else if (state==='tutorial') drawTutHUD();
  else { drawHUD(); if (state==='over') drawOver(); if (state==='win') drawWin(); }
  const fa = Math.max(xfade, state==='tutorial' && tut.toMain!=null ? clamp(tut.toMain/.35,0,1) : 0);

}

const refBody = document.getElementById('refBody'), refTab = document.getElementById('refTab'), refStatus = document.getElementById('refStatus');
const refInputs = {}, refOuts = {}, refHold = document.getElementById('refHold');
function refFmt(c, v){ return (c.pre||'')+(c.fmt ? c.fmt(v) : String(+v.toFixed(1)))+c.unit+(c.extra ? c.extra(v) : ''); }
function refMatch(){ for (const id in PRESETS){ const v = PRESETS[id].v; if (Object.keys(v).every(k => Math.abs(v[k]-R[k])<1e-9)) return id; } return null; }
function refSync(){
  REF_GROUPS.forEach(g => g.ctl.forEach(c => { refInputs[c.k].value = R[c.k]; refOuts[c.k].textContent = refFmt(c, R[c.k]); }));
  const m = refMatch();
  document.querySelectorAll('#refBody [data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset===m));
}
function toggleRefine(force){

  refBody.hidden = !open; refTab.setAttribute('aria-expanded', String(open));
  refTab.textContent = '⚙ REFINEMENT CONTROLS '+(open?'▾':'▸');
  if (!open && document.activeElement && document.activeElement.closest('#refine')) document.activeElement.blur();
}
(function buildRefine(){

      refInputs[c.k] = w.querySelector('input'); refOuts[c.k] = w.querySelector('output');

  document.querySelectorAll('#refBody [data-preset]').forEach(b => b.addEventListener('click', () => {

  }));
  const pvSync = () => {
    document.querySelectorAll('#refBody [data-pv]').forEach(b => b.classList.toggle('on', !!preview && b.dataset.pv===preview.kind));
    document.getElementById('pvExit').disabled = !preview;
  };
  document.querySelectorAll('#refBody [data-pv]').forEach(b => b.addEventListener('click', () => {
    startPreview(b.dataset.pv); pvSync(); refStatus.textContent = 'Previewing '+PV_NAMES[b.dataset.pv]+' — game paused.';
  }));
  refHold.addEventListener('change', () => {
    if (refHold.checked && (!preview || preview.kind!=='charge')) startPreview('charge');
    pvSync(); refStatus.textContent = refHold.checked ? 'Holding at 80% charge.' : 'Charge loop running.';
  });
  document.getElementById('pvExit').addEventListener('click', () => { stopPreview(); refHold.checked = false; pvSync(); refStatus.textContent = 'Preview closed — game resumed.'; });
  document.getElementById('refReset').addEventListener('click', () => { Object.assign(R, FINAL); refSync(); refStatus.textContent = 'Final settings restored.'; });
  document.getElementById('refCopy').addEventListener('click', () => {
    const m = refMatch();
    const lines = ['Monster Mayhem — refinement settings'+(m ? ' ('+PRESETS[m].name+')' : ' (custom)')];
    REF_GROUPS.forEach(g => { lines.push(g.title+' ('+g.q+')'); g.ctl.forEach(c => lines.push('  '+c.label+': '+refFmt(c, R[c.k]))); });
    const text = lines.join('\n');
    const done = ok => { refStatus.textContent = ok ? 'Values copied to clipboard.' : 'Copy failed — select the numbers above instead.'; };
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try { ok = document.execCommand('copy'); } catch (err) {} ta.remove(); done(ok); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done(true), fallback); else fallback();
  });
  refSync();
})();

/* ---------- PREVIEW BEHAVIOR (documentation only) ----------
   Pauses the game exactly where it is and shows a small demo scene that uses the live
   refinement values. Nothing here touches game or tutorial state; closing resumes the game. */
let preview = null;          // {kind, t, ...sim state}
const PV_NAMES = {wake:'Spongy Wake', move:'Snappy Movement', fly:'Light Flying', charge:'Springy Charge'};
const PV_FEEL = {wake:'Spongy', move:'Snappy', fly:'Light', charge:'Springy'};
function startPreview(kind){
  preview = {kind, t:0, q:0, qv:0, target:0, k:160, c:2*Math.sqrt(160), ripples:[], lastPh:0,
    x:110, vx:0, ghosts:[], gT:0, speeds:[], fx:120, fvx:0, ftxs:120, fang:0, fav:0, fBob:0, path:[], pT:0,
    st:'rest', stT:0, charge:0, grow:0, sq:0, sqv:0, sqT:0, py:0, vy:0, jumpV:1, pulsePh:0, pulseRate:TAU/2.6, pulseAmp:.018};
  keys.left = keys.right = keys.jump = false; mouseDown = false;
  cv.style.cursor = 'default';
}
function stopPreview(){ preview = null; last = performance.now(); }
function hold80(){ return !!(refHold && refHold.checked); }

function updatePreview(dt){
  const v = preview; v.t += dt; time += dt;
  P.blinkT -= dt; if (P.blinkT<=0){ P.blink=.12; P.blinkT=rand(2,4); } P.blink -= dt;
  const n = Math.max(1,Math.ceil(dt*240)), h = dt/n;
  if (v.kind==='wake'){
    const ph = v.t % 2.6;                                    // press at 0.4 s, release at 0.65 s, then rest
    if (v.lastPh<.4 && ph>=.4){ v.target=1; v.k=380; v.c=30; }
    if (v.lastPh<.65 && ph>=.65){ v.target=0; v.k=80; v.c=2*Math.sqrt(80)*dampingFor(R.wakeOvershoot); v.ripples.push({age:-.14}); }
    v.lastPh = ph;
    for (let i=0;i<n;i++){ v.qv += (-v.k*(v.q-v.target) - v.c*v.qv)*h; v.q += v.qv*h; }
    v.ripples.forEach(r => r.age += dt); v.ripples = v.ripples.filter(r => r.age<1.7);
  } else if (v.kind==='move'){
    const ph = v.t % 3.2, dir = ph<1.1 ? 1 : ph<1.6 ? 0 : ph<2.7 ? -1 : 0;   // run right, stop, run left, stop
    v.vx += (dir*228 - v.vx)*Math.min(1, R.moveResponse*dt);
    v.x = clamp(v.x + v.vx*dt, 50, W-50);
    if (dir) P.face = dir;
    P.walkT += dt*Math.abs(v.vx)/200;
    v.gT -= dt; if (v.gT<=0){ v.gT = .08; v.ghosts.push({x:v.x, vx:v.vx, face:P.face, walkT:P.walkT, age:0}); }
    v.ghosts.forEach(g => g.age += dt); v.ghosts = v.ghosts.filter(g => g.age<1.2);
    v.speeds.push({t:v.t, s:v.vx}); while (v.speeds.length && v.t-v.speeds[0].t>3.2) v.speeds.shift();
  } else if (v.kind==='fly'){
    const L = R.flyEase/100, tx = (Math.floor(v.t/2.4)%2) ? 360 : 120;      // the "mouse" hops side to side
    v.tx = tx;
    const kx = 13/L, cx = 5.4/Math.pow(L,.8);
    for (let i=0;i<n;i++){
      v.ftxs += (tx-v.ftxs)*(1-Math.exp(-h*7/L));
      v.fvx += (-kx*(v.fx-v.ftxs) - cx*v.fvx)*h; v.fx += v.fvx*h;
      const lt = clamp(v.fvx*.024,-18,18); v.fav += (-45*(v.fang-lt) - 5.5*v.fav)*h; v.fang += v.fav*h;
    }
    const bk = R.flyBob/100;
    v.fBob = (Math.sin(v.t*TAU/3.6)+.18*Math.sin(v.t*TAU/1.8+1.2))*9*bk;
    v.sway = Math.sin(v.t*TAU/5.6)*6*bk; v.idle = Math.cos(v.t*TAU/5.6)*2.4*bk;
    if (Math.abs(v.fvx)>30) P.face = v.fvx>0 ? 1 : -1;
    v.pT -= dt; if (v.pT<=0){ v.pT = .05; v.path.push({x:v.fx+v.sway, y:v.fBob, age:0}); }
    v.path.forEach(p => p.age += dt); v.path = v.path.filter(p => p.age<2.4);
  } else {
    if (hold80()){                                      // frozen at 80%: grown, squashed, ring at 80%
      v.st = 'hold'; v.charge = .8; v.grow = .8; v.sq = 1-.85*.8; v.sqv = 0; v.py = 0; v.vy = 0;
      v.pulseAmp = .015+.05*.8;
      return;
    }
    if (v.st==='hold'){ v.st = 'rest'; v.stT = 0; v.charge = 0; }
    v.stT += dt;
    if (v.st==='rest'){ v.sqT = 0; v.grow *= Math.exp(-dt*7); if (v.stT>.8){ v.st='charge'; v.stT=0; } }
    else if (v.st==='charge'){
      v.charge = Math.min(1, v.charge+dt/R.chargeTime); v.grow = v.charge; v.sqT = 1-.85*v.charge;
      if (v.charge>=1){ v.st='flight'; v.stT=0; const jh = TB.RISE+TB.h0*.5*Math.max(.4,R.boost/100); v.jumpV = Math.sqrt(2*TB.g*jh); v.vy = -v.jumpV; v.grow = 1; v.charge = 0; v.sq = -1.2; v.sqv = 0; v.sqT = 0; sfx('boost'); }
    } else if (v.st==='flight'){
      v.vy += TB.g*dt; v.py += v.vy*dt; v.grow *= Math.exp(-dt*5);
      if (v.py>=0 && v.vy>0){ v.py = 0; v.vy = 0; v.st='rest'; v.stT=0; v.sq = .85; v.sqv = 0; }
    }
    const building = v.st==='charge';
    const rateT = building ? TAU*(1.8+10*v.charge) : TAU/2.6, ampT = building ? .015+.05*v.charge : .018;
    v.pulseRate += (rateT-v.pulseRate)*(1-Math.exp(-dt*10)); v.pulseAmp += (ampT-v.pulseAmp)*(1-Math.exp(-dt*10)); v.pulsePh += v.pulseRate*dt;
    for (let i=0;i<n;i++){ v.sqv += (-480*(v.sq-v.sqT) - 34*v.sqv)*h; v.sq += v.sqv*h; }
  }
}

function pvPanel(lines, y){

function pvMonster(x,y,s,o){ drawMonster(ctx,x,y,s,Object.assign({face:P.face,sq:0,mood:'happy',walk:false,walkT:P.walkT,air:false,blink:P.blink,lx:0,ly:.2,rot:0,t:time},o)); }
function pvGround(y){ ctx.fillStyle='#4ac03a'; rr(ctx,30,y,W-60,10,5); ctx.fill(); ctx.fillStyle='#2b1a62'; ctx.fillRect(30,y+10,W-60,6); }

function renderPreview(){

      ctx.fillStyle=ag; circ(ctx,W/2,py-24*s,(55+55*k)*s); ctx.fill();
    }
    pvMonster(W/2+dx, py, s, {ex:sx, ey:sy, mood: v.st==='flight' ? 'jump' : (v.charge>.05||held) ? 'gulp' : 'happy', air:v.st==='flight'});
    if (v.charge>.003 && v.st!=='flight'){
      const curW = TB.W0*sx*s, curH = TB.h0*sy*s, rx = curW/2+18, ry = curH/2+18, ry0 = py-curH/2-4;
      ctx.save(); ctx.strokeStyle='#fff'; ctx.globalAlpha=.3; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(W/2,ry0,rx,ry,0,0,TAU); ctx.stroke();
      ctx.globalAlpha=1; ctx.strokeStyle=v.charge>.7?'#fff3b0':'#ffe14a'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.ellipse(W/2,ry0,rx,ry,0,-Math.PI/2,-Math.PI/2+TAU*v.charge); ctx.stroke();
      const ea = -Math.PI/2+TAU*v.charge; ctx.fillStyle='#ffe14a'; circ(ctx,W/2+rx*Math.cos(ea),ry0+ry*Math.sin(ea),5); ctx.fill(); ctx.restore();
      txt(Math.round(v.charge*100)+'%', W/2+rx+22, ry0, 16, '#ffe14a', {lw:4});
    }
    if (held){                                   // tremble marks stand in for the vibration in a still
      const amp = Math.pow(.8,1.2)*TB.W0*.055*s, hw = TB.W0*sx*s/2;
      ctx.save(); ctx.strokeStyle='#ffe14a'; ctx.lineWidth=2.5; ctx.lineCap='round';
      for (const sd of [-1,1]) for (let i=0;i<3;i++){ const x0 = W/2+sd*(hw+10+i*7), yy = py-TB.h0*sy*s*.5; ctx.globalAlpha=.9-i*.25; ctx.beginPath(); ctx.moveTo(x0,yy-8-amp); ctx.lineTo(x0,yy+8+amp); ctx.stroke(); }
      ctx.restore();
    }
    const sizePct = Math.round((gs*pulse-1)*100), sqPct = Math.round(.14*v.sq*100);
    const ly = 560;
    ctx.fillStyle='rgba(12,6,40,.78)'; rr(ctx,40,ly,W-80,held?78:56,12); ctx.fill();
    txt(held ? 'FROZEN AT 80% CHARGE' : 'state: '+v.st, W/2, ly+18, 15, held?'#ffe14a':'#ccc', {lw:3});
    txt('size +'+Math.max(0,sizePct)+'%   ·   squash '+Math.max(0,sqPct)+'%   ·   apex '+Math.round(apex)+' px', W/2, ly+40, 13, '#fff', {lw:3});
    if (held) txt('faint outline = resting size', W/2, ly+60, 11, '#ccc', {lw:2});
  }
  head.push(pname);
  pvPanel(head, 16);
  txt('Preview only — game paused, tutorial progress unchanged', W/2, H-18, 12, '#9a86d6', {lw:3});
}

startTutorial();
// read-only snapshot for testing from the console
window.__mm = () => ({preview: preview ? {kind: preview.kind, st: preview.st, charge: preview.charge, t: preview.t, hold: hold80()} : null, R: Object.assign({}, R), state, step: tut ? tut.step : null, flying: !!(tut && tut.flying), landed: !!(tut && tut.landed), gi: tut ? tut.gi : null,
  did: tut && tut.did ? Object.assign({}, tut.did) : null, ch: tut && tut.ch ? {state: tut.ch.state, charge: tut.ch.charge, idx: tut.ch.idx, done: tut.ch.done} : null,
  P: {x: P.x, y: P.y, sc: P.sc, hp: P.hp}, camY, score, gates: tut && tut.gates, pick: tut && tut.pick, cp: tut && tut.cp ? {x: tut.cp.x, w: tut.cp.w, y: tut.cp.y} : null});
document.getElementById('restartAll').addEventListener('click', e => {
  e.currentTarget.blur();
  const inGame = state==='play' || state==='over' || state==='win' || state==='starting' || state==='title';
  if (inGame && !confirm('Restart from Tutorial Step 1? Your current run will end.')) return;
  startTutorial();
});

let last = performance.now();
function frame(now){
  const dt = Math.min(.033,(now-last)/1000); last = now;
  if (preview){ updatePreview(dt); renderPreview(); }
  else { step(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
